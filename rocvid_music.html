<!DOCTYPE html>
<html lang="ms" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Rocvid Music Studio</title>
<style>
:root{
  --bg:#F4F3FA;--surface:#FFFFFF;--surface2:#ECEBF7;--ink:#12102A;--muted:#66647E;--line:#E3E1F0;
  --accent:#5148FF;--accent-ink:#FFFFFF;--sun:#FFC83D;--danger:#D62F4B;--ok:#16895F;
  --shadow:0 1px 2px rgba(20,16,60,.06),0 10px 30px rgba(20,16,60,.09);color-scheme:light;
}
:root[data-theme="dark"]{
  --bg:#0A0918;--surface:#14132B;--surface2:#1D1C3A;--ink:#F3F2FF;--muted:#A5A3C6;--line:#2A2950;
  --accent:#8B84FF;--accent-ink:#0A0918;--danger:#FF6B84;--ok:#3ECF94;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 12px 36px rgba(0,0,0,.45);color-scheme:dark;
}
*{box-sizing:border-box;margin:0}
body{font:15px/1.45 "Avenir Next","Segoe UI",system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
a{color:inherit}
.ic{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.sr{position:absolute;opacity:0;width:1px;height:1px;overflow:hidden}
.ab{width:18px;height:18px;vertical-align:-4px;margin-left:5px;flex:none}
.muted,.ch,.st{color:var(--muted);font-size:13px}
.st{display:flex;gap:12px;flex-wrap:wrap}

.top{position:sticky;top:0;z-index:30;height:68px;display:flex;align-items:center;gap:12px;padding:0 24px;background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.logo{display:flex;align-items:center;gap:10px;font-weight:850;font-size:25px;letter-spacing:-.05em;color:inherit;text-decoration:none}
.logo svg{width:36px;height:36px}
.stag{display:inline-flex;align-items:center;gap:6px;background:var(--sun);color:#15132B;font-size:13px;font-weight:800;padding:4px 12px;border-radius:999px}
.top .sp{flex:1}
.btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:9px 18px;font-weight:650;cursor:pointer;text-decoration:none;white-space:nowrap}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.sun{background:var(--sun);color:#15132B;border-color:var(--sun)}
.btn.ghost{background:none}
.btn.sm{padding:5px 12px;font-size:13px}
.btn.wide{width:100%;justify-content:center;margin-top:8px}
.btn.danger{color:var(--danger);border-color:var(--danger)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn .ic{width:20px;height:20px}
.iconbtn{width:42px;height:42px;padding:0;justify-content:center}

main{max-width:1240px;margin:0 auto;padding:28px 26px 64px}
.ph{font-size:30px;font-weight:850;letter-spacing:-.04em;margin-bottom:6px}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin:18px 0 22px;overflow-x:auto}
.tabs button{border:0;background:none;padding:11px 18px;font-weight:680;color:var(--muted);cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.status{display:inline-flex;align-items:center;font-size:12px;font-weight:700;padding:3px 10px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--muted);white-space:nowrap}
.status.live,.status.approved{color:var(--ok);border-color:currentColor}
.status.live{background:color-mix(in srgb,var(--ok) 14%,transparent)}
.status.submitted,.status.pending{color:var(--accent);border-color:currentColor}
.status.rejected,.status.suspended{color:var(--danger);border-color:currentColor}
.status.taken_down{text-decoration:line-through}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:22px}
.stats div{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px 18px;box-shadow:var(--shadow);display:grid}
.stats b{font-size:30px;font-weight:850;letter-spacing:-.04em}
.stats span{color:var(--muted);font-size:13px}
.actions{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}
.rlist,.alist{display:grid;gap:12px}
.rrow{display:flex;align-items:center;gap:16px;padding:14px;background:var(--surface);border:1px solid var(--line);border-radius:20px;cursor:pointer}
.rrow:hover{border-color:var(--accent)}
.rcov{position:relative;flex:none;width:70px;height:70px;border-radius:12px;overflow:hidden;background:var(--g)}
.rcov img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.rinfo{flex:1;min-width:0}
.rinfo h3{font-size:17px;font-weight:720}
.empty{max-width:460px;margin:50px auto;text-align:center}
.empty h2{font-size:20px;margin-bottom:6px}
.empty p{color:var(--muted);margin-bottom:18px}

.sec{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:20px;margin-bottom:16px}
.sec h3{display:flex;align-items:center;gap:10px;font-size:18px;margin-bottom:14px}
.n{display:inline-grid;place-items:center;width:28px;height:28px;border-radius:50%;background:var(--accent);color:var(--accent-ink);font-size:13px;font-weight:800}
.ed{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:22px;align-items:start}
.edmain{border:0;padding:0;min-width:0}
.edmain:disabled{opacity:.8}
.edtop{display:flex;align-items:center;gap:12px;margin-bottom:10px;flex-wrap:wrap}
.savest{color:var(--muted);font-size:13px;margin-left:auto}
.chkp{position:sticky;top:90px}
.chkp>div{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:20px;box-shadow:var(--shadow)}
.chkp h3{display:flex;align-items:center;gap:10px;font-size:18px;margin-bottom:12px}
.bar{height:8px;border-radius:99px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--ok);border-radius:99px;transition:width .3s}
.pct{margin:6px 0 10px;font-weight:650;font-size:14px}
.errs{list-style:none;padding:0;display:grid;gap:6px;font-size:14px;max-height:340px;overflow:auto}
.errs li{display:flex;gap:8px;align-items:flex-start;color:var(--danger)}
.errs .ic{width:16px;height:16px;margin-top:3px;stroke-width:2.6}
.okmsg{display:flex;gap:8px;align-items:center;color:var(--ok);font-weight:650}
.demo{margin-top:12px;padding-top:12px;border-top:1px solid var(--line)}
.demo input{width:100%;margin-top:8px;border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:9px 12px}
.log{list-style:none;padding:0;margin-top:14px;display:grid;gap:6px}
.log li{display:flex;justify-content:space-between;align-items:center}

.f{display:grid;gap:6px;font-weight:600;font-size:14px;align-content:start}
.f input,.f select,.f textarea{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:10px 12px;font-weight:400}
.f input.uc{text-transform:uppercase}
.f small{color:var(--muted);font-weight:400}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.fgrid .full{grid-column:1/-1}
.terr{margin-top:14px}
.terr .lbl{display:block;font-weight:600;font-size:14px;margin-bottom:8px}
.terr label{display:inline-flex;align-items:center;gap:6px;margin:0 8px 8px 0;border:1px solid var(--line);padding:6px 13px;border-radius:999px;font-size:14px;cursor:pointer;background:var(--bg)}
.drop{display:block;border:2px dashed var(--line);border-radius:14px;padding:20px 14px;text-align:center;cursor:pointer;background:var(--bg);font-weight:600}
.drop.sm{padding:12px;margin-top:14px}
.drop:hover,.drop:focus-within{border-color:var(--accent)}
.drop small{display:block;color:var(--muted);font-weight:400;margin-top:2px}
.chk{display:flex;gap:10px;align-items:flex-start;font-weight:400;font-size:14px}
.chk input{margin-top:4px}
.covrow{display:flex;gap:18px;align-items:flex-start;flex-wrap:wrap}
.covprev{position:relative;width:156px;aspect-ratio:1;border-radius:16px;overflow:hidden;background:var(--g)}
.covprev img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.covrow>div:last-child{flex:1;min-width:220px}
.dim{display:flex;gap:6px;align-items:center;margin-top:10px;font-weight:650;font-size:14px}
.dim.ok{color:var(--ok)}.dim.bad{color:var(--danger)}
.dim .ic{width:17px;height:17px;stroke-width:2.6}
.tk{border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:14px;background:var(--bg)}
.tkh{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.tk .f input,.tk .f select{background:var(--surface)}
.mvbox{margin-top:14px;padding-top:12px;border-top:1px solid var(--line);display:grid;gap:8px}
.mvrow{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--surface);border-radius:12px;padding:6px 6px 6px 12px}
.mvadd{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.mvadd select{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:9px 12px}
.note{padding:12px 14px;border-radius:14px;margin-bottom:14px;border:1px solid var(--line);background:var(--surface)}
.note.bad{border-color:var(--danger);color:var(--danger)}
.note.info{border-color:var(--accent)}
.err{color:var(--danger);font-weight:600;min-height:1.2em;font-size:14px}

/* Carian artis (taip untuk padan) */
.ap{position:relative}
.apbox{display:flex;flex-wrap:wrap;gap:6px;align-items:center;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:6px 8px;min-height:44px}
.apbox:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 25%,transparent)}
.apchip{display:inline-flex;align-items:center;gap:4px;background:var(--surface2);border-radius:999px;padding:3px 4px 3px 12px;font-weight:650;font-size:14px}
.apchip button{border:0;background:none;cursor:pointer;color:var(--muted);display:grid;place-items:center;padding:2px;border-radius:50%}
.apchip .ic{width:16px;height:16px}
.apin{flex:1;min-width:140px;border:0!important;background:none!important;outline:none;padding:6px 4px!important;box-shadow:none!important}
.aplist{position:absolute;left:0;right:0;top:calc(100% + 6px);z-index:20;list-style:none;margin:0;padding:6px;background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);max-height:300px;overflow:auto}
.aplist[hidden]{display:none}
.apitem{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:10px;cursor:pointer;font-weight:560}
.apitem[aria-selected="true"],.apitem:hover{background:var(--surface2)}
.apitem .av{width:30px;height:30px;font-size:13px}
.apitem mark{background:color-mix(in srgb,var(--sun) 55%,transparent);color:inherit;border-radius:3px}
.apitem small{margin-left:auto;color:var(--muted);font-weight:500}
.apitem.new{color:var(--accent)}
.apempty{padding:10px;color:var(--muted);font-size:14px}

.av{flex:none;width:52px;height:52px;border-radius:50%;background:var(--g);display:grid;place-items:center;color:#fff;font-weight:800;font-size:22px;overflow:hidden}
.av img{width:100%;height:100%;object-fit:cover}
.two-col{display:grid;grid-template-columns:minmax(0,400px) minmax(0,1fr);gap:22px;align-items:start}
.arow{display:flex;gap:14px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px;flex-wrap:wrap}
.arow>div:nth-child(2){flex:1;min-width:170px}
.arow strong{display:flex;align-items:center;font-size:16px}
.arow .acts{display:flex;gap:6px;flex-wrap:wrap}
.badgebox{display:flex;gap:16px;align-items:center;padding:18px;border-radius:20px;border:1px solid color-mix(in srgb,var(--sun) 50%,var(--line));background:linear-gradient(135deg,color-mix(in srgb,var(--sun) 18%,var(--surface)),var(--surface));margin-bottom:14px}
.badgebox .ab{width:56px;height:56px;margin:0}
.badgebox p{color:var(--muted);font-size:14px}
.cathead{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.cathead h3{margin:0}
.catrow{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line);flex-wrap:wrap}
.cn{width:24px;color:var(--muted);font-weight:700}
.ct{flex:1;min-width:140px;display:grid}
.media{display:flex;gap:6px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 13px;font-size:13px;font-weight:600;text-decoration:none}
.chip .ic{width:14px;height:14px}
.chip.dim2{color:var(--muted)}
.cogrid{display:grid;grid-template-columns:max-content 1fr;gap:8px 22px;font-size:14px}
.cogrid dt{color:var(--muted)}
.cogrid dd{margin:0;overflow-wrap:anywhere}
.landing{max-width:760px;margin:40px auto;text-align:center;padding:36px 28px;border-radius:28px;border:1px solid var(--line);background:var(--surface);box-shadow:var(--shadow)}
.landing .ab{width:64px;height:64px;margin:0 0 14px}
.landing h1{font-size:34px;letter-spacing:-.04em;line-height:1.1;margin-bottom:10px}
.landing p{color:var(--muted);max-width:52ch;margin:0 auto 18px}
.landing ul{list-style:none;padding:0;display:grid;gap:8px;max-width:420px;margin:0 auto 22px;text-align:left}
.landing li{display:flex;gap:10px;align-items:flex-start}
.landing li .ic{color:var(--ok);margin-top:2px;stroke-width:2.6;width:18px;height:18px}
pre{background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:14px;overflow:auto;font-size:13px;line-height:1.55}
code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:13px}
.keybox{padding:12px 14px;border-radius:14px;background:color-mix(in srgb,var(--sun) 28%,transparent);border:1px solid var(--sun);margin:12px 0;overflow-wrap:anywhere}
.flow{display:grid;gap:6px;font-size:14px}
@media (max-width:1100px){.ed{grid-template-columns:1fr}.chkp{position:static}.two-col{grid-template-columns:1fr}}
@media (max-width:760px){
  .top{padding:0 12px;gap:8px}
  .logo span,.top .btn span,.top .gbtn span{display:none}
  .top .btn{padding:10px}
  main{padding:18px 14px 64px}
  .fgrid{grid-template-columns:1fr}
  .stats{grid-template-columns:1fr 1fr}
}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
  <linearGradient id="abGrad" gradientUnits="userSpaceOnUse" x1="2" y1="2" x2="22" y2="22"><stop offset="0" stop-color="#FFE08A"/><stop offset="1" stop-color="#FF9F43"/></linearGradient>
</defs></svg>

<header class="top">
  <a class="logo" href="index.html" aria-label="Rocvid, ke laman utama">
    <svg viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="10" fill="var(--accent)"/><path d="M12 8.5l12 7.5-12 7.5z" fill="var(--accent-ink)"/><circle cx="7.2" cy="24.8" r="2.3" fill="var(--sun)"/></svg>
    <span>rocvid</span>
  </a>
  <span class="stag"><svg class="ic" style="width:16px;height:16px" viewBox="0 0 24 24"><path d="M9 18V5l11-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="17" cy="16" r="3"/></svg>Music Studio</span>
  <span class="sp"></span>
  <button class="btn iconbtn" id="themeBtn" aria-label="Tukar tema gelap atau cerah"></button>
  <div id="auth"></div>
</header>

<main id="main"><div class="empty"><p>Memuatkan…</p></div></main>

<dialog id="mergeDlg" aria-labelledby="mgT">
  <form id="mergeForm">
    <header><h2 id="mgT">Gabung dengan saluran biasa</h2><button type="button" class="x" data-close aria-label="Tutup"><svg class="ic" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button></header>
    <p class="muted">Lagu dan video muzik <b id="mgArtist"></b> akan diterbitkan di saluran yang anda pilih. Saluran itu mendapat lencana artis, dan kandungan serta pelanggan saluran artis asal dipindahkan ke situ.</p>
    <label class="f">Saluran anda<select id="mgCh"></select></label>
    <p class="err" id="mgErr" role="alert"></p>
    <footer><button type="button" class="btn" data-close>Batal</button><button type="submit" class="btn primary" id="mgGo">Gabungkan</button></footer>
  </form>
</dialog>

<dialog id="achDlg" aria-labelledby="achT">
  <form id="achForm">
    <header><h2 id="achT">Edit saluran artis</h2><button type="button" class="x" data-close aria-label="Tutup"><svg class="ic" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button></header>
    <label class="f">Bio saluran<textarea id="achBio" rows="4" maxlength="500"></textarea></label>
    <div class="fgrid">
      <label class="f">Gambar profil<input id="achAvatar" type="file" accept="image/*"></label>
      <label class="f">Sepanduk<input id="achBanner" type="file" accept="image/*"></label>
    </div>
    <p class="err" id="achErr" role="alert"></p>
    <footer><button type="button" class="btn" data-close>Batal</button><button type="submit" class="btn primary" id="achGo">Simpan</button></footer>
  </form>
</dialog>

<script src="config.js"></script>
<script src="rocvid-core.js"></script>
<script>
/* ================= Pemalar ================= */
const GENRES = ['Pop', 'Rock', 'Hip-hop/Rap', 'R&B', 'Dangdut', 'Nasyid', 'Tradisional', 'Elektronik', 'Jazz', 'Klasik', 'Indie', 'Lain-lain'];
const LANGS = [['ms','Bahasa Melayu'],['en','English'],['id','Bahasa Indonesia'],['zh','Mandarin'],['ta','Tamil'],['ar','Arab'],['ja','Jepun'],['ko','Korea']];
const TERRS = [['WW','Seluruh dunia'],['MY','Malaysia'],['SG','Singapura'],['ID','Indonesia'],['BN','Brunei'],['TH','Thailand'],['US','Amerika Syarikat'],['GB','United Kingdom']];
const COUNTRIES = [['MY','Malaysia'],['SG','Singapura'],['ID','Indonesia'],['BN','Brunei'],['TH','Thailand'],['PH','Filipina'],['US','Amerika Syarikat'],['GB','United Kingdom'],['AU','Australia'],['JP','Jepun'],['KR','Korea Selatan']];
const RTYPES = [['single','Single (1-3 lagu)'],['ep','EP (4-6 lagu)'],['album','Album (7+ lagu)'],['compilation','Kompilasi']];
const EXPL = [['not_explicit','Tidak eksplisit'],['explicit','Eksplisit'],['clean','Versi bersih']];
const MV_TYPES = [['official_music_video','Video rasmi'],['lyric_video','Video lirik'],['visualizer','Visualizer'],['live_performance','Persembahan langsung']];
const MV_LABEL = Object.fromEntries(MV_TYPES.map(([k, l]) => [k, l[0].toUpperCase() + l.slice(1)]));
const STATUS_LABEL = { draft:'Draf', submitted:'Dihantar', approved:'Diluluskan', rejected:'Ditolak', live:'Live', taken_down:'Ditarik balik', pending:'Menunggu kelulusan', suspended:'Digantung' };

/* ================= Keadaan ================= */
const ST = { dist:null, artists:[], releases:[], channels:{}, videos:[], keys:[], personal:[], admin:{ dists:[], releases:[] } };
const UI = { tab:null, editing:null, editCo:false, newKey:null, ap:{ field:null, items:[], idx:-1 }, merge:null, ach:null };
const curRel = () => ST.releases.find(r => r.id === UI.editing);
const approved = () => !!ST.dist && ST.dist.status === 'approved';
const isAdmin = () => !!(RV.profile && RV.profile.is_admin);
const artistOf = id => ST.artists.find(a => a.id === id);
const editable = r => ['draft', 'rejected'].includes(r.status);
const typeName = t => (RTYPES.find(x => x[0] === t) || [, t])[1];
const norm = s => String(s || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase();
const F = (label, html, cls = '') => `<label class="f ${cls}"><span>${label}</span>${html}</label>`;
const opts = (list, cur) => list.map(([v, l]) => `<option value="${v}" ${v === cur ? 'selected' : ''}>${esc(l)}</option>`).join('');
const avatarOf = (ch, name) => ch && ch.avatar ? `<img src="${esc(ch.avatar)}" alt="">` : esc((name || '?')[0].toUpperCase());

/* ================= Muat data ================= */
const mapArtist = a => ({ id:a.id, name:a.name, channelId:a.channel_id, country:a.country, bio:a.bio || '' });
const mapTrack = t => ({ id:t.id, title:t.title || '', version:t.version_title || '', isrc:t.isrc || '', explicit:t.explicit, audioPath:t.audio_path, audioName:t.audio_name || '',
  format:t.audio_format || '', rate:t.sample_rate || 0, depth:t.bit_depth || 0, dur:+t.duration_s || 0, composer:t.composer || '', lyricist:t.lyricist || '',
  producer:t.producer || '', publisher:t.publisher || '', mvType:'official_music_video' });
function mapRelease(r, trs, ras) {
  const ra = role => ras.filter(x => x.release_id === r.id && x.role === role).sort((a, b) => a.position - b.position).map(x => x.artist_id);
  return { id:r.id, title:r.title || '', version:r.version_title || '', type:r.type, label:r.label_name || '', genre:r.genre || '', language:r.language || 'ms',
    origDate:r.original_release_date || '', relDate:r.release_date || '', p:r.p_line || '', c:r.c_line || '', upc:r.upc || '', territories:r.territories || ['WW'], explicit:r.explicit,
    coverPath:r.cover_path, cover:r.cover_path ? { w:r.cover_w || 0, h:r.cover_h || 0, name:'Gambar muka depan' } : null,
    status:r.status, rejection:r.rejection_reason || '', ts:{ created:r.created_at, submitted:r.submitted_at, approved:r.approved_at, live:r.live_at, taken:r.taken_down_at },
    primary:ra('primary'), featured:ra('featured'), tracks:trs.filter(t => t.release_id === r.id).sort((a, b) => a.position - b.position).map(mapTrack) };
}
async function loadStudio() {
  ST.dist = null; ST.artists = []; ST.releases = []; ST.videos = []; ST.keys = []; ST.personal = [];
  if (!RV.user) return;
  const [mem, mine] = await Promise.all([
    must(sb.from('distributor_members').select('distributor_id').eq('user_id', RV.user.id)),
    must(sb.from('channels').select('*').eq('owner_id', RV.user.id))
  ]);
  mine.forEach(c => { ST.channels[c.id] = mapChannel(c); });
  ST.personal = mine.filter(c => c.kind === 'personal' && !c.is_artist).map(c => c.id);
  if (mem.length) ST.dist = await must(sb.from('distributors').select('*').eq('id', mem[0].distributor_id).maybeSingle());
  if (approved()) await loadCatalog();
  if (isAdmin()) await loadAdmin();
}
async function loadCatalog() {
  const d = ST.dist.id;
  const [arts, rels, keys] = await Promise.all([
    must(sb.from('artists').select('*').eq('distributor_id', d).order('name')),
    must(sb.from('releases').select('*').eq('distributor_id', d).order('created_at', { ascending:false })),
    must(sb.from('api_keys').select('*').eq('distributor_id', d).order('created_at', { ascending:false }))
  ]);
  ST.artists = arts.map(mapArtist); ST.keys = keys.filter(k => !k.revoked_at);
  const ids = rels.map(r => r.id); let trs = [], ras = [], vids = [];
  if (ids.length) [trs, ras, vids] = await Promise.all([
    must(sb.from('tracks').select('*').in('release_id', ids)), must(sb.from('release_artists').select('*').in('release_id', ids)), must(sb.from('videos').select('*').in('release_id', ids))]);
  const chIds = [...new Set(arts.map(a => a.channel_id).filter(Boolean))];
  if (chIds.length) (await must(sb.from('channels').select('*').in('id', chIds))).forEach(c => { ST.channels[c.id] = mapChannel(c); });
  ST.videos = vids.map(mapVideo); ST.releases = rels.map(r => mapRelease(r, trs, ras));
}
async function loadAdmin() {
  const [dists, rels] = await Promise.all([
    must(sb.from('distributors').select('*').order('created_at', { ascending:false })),
    must(sb.from('releases').select('id,title,status,distributor_id,created_at').in('status', ['submitted', 'approved']).order('created_at', { ascending:false }))]);
  ST.admin = { dists, releases:rels };
}

const relRow = r => ({ title:r.title, version_title:r.version || null, type:r.type, label_name:r.label || null, genre:r.genre || null, language:r.language || null,

/* Peraturan yang sama dengan release_validation() dalam pangkalan data */
function validate(rel) {
  const E = []; let total = 0;
  const ck = (ok, code, msg) => { total++; if (!ok) E.push({ code, msg }); };
  const line = /^(19|20)[0-9]{2} .+/;
  ck(!!rel.title.trim(), 'TITLE_REQUIRED', 'Tajuk release diperlukan');
  ck(/^[0-9]{12,13}$/.test(rel.upc), 'UPC_REQUIRED', 'UPC/EAN (12-13 digit) diperlukan');
  ck(!!rel.label.trim(), 'LABEL_REQUIRED', 'Nama label diperlukan');
  ck(!!rel.genre, 'GENRE_REQUIRED', 'Genre diperlukan');
  ck(!!rel.language, 'LANGUAGE_REQUIRED', 'Bahasa diperlukan');
  ck(!!rel.origDate && !!rel.relDate, 'RELEASE_DATE_REQUIRED', 'Tarikh keluaran asal dan tarikh keluaran di Rocvid diperlukan');
  ck(!rel.origDate || !rel.relDate || rel.relDate >= rel.origDate, 'RELEASE_DATE_ORDER', 'Tarikh di Rocvid tidak boleh lebih awal daripada tarikh keluaran asal');
  ck(line.test(rel.p), 'P_LINE_INVALID', 'P-line mesti berformat "TAHUN Pemilik", cth. 2026 Nama Label');
  ck(line.test(rel.c), 'C_LINE_INVALID', 'C-line mesti berformat "TAHUN Pemilik", cth. 2026 Nama Pemilik');
  const c = rel.cover;
  ck(!!rel.coverPath, 'COVER_REQUIRED', 'Gambar muka depan diperlukan');
  if (c) { ck(c.w === c.h, 'COVER_NOT_SQUARE', 'Gambar muka depan mesti segi empat sama'); ck(c.w >= 3000, 'COVER_TOO_SMALL', 'Gambar muka depan mesti sekurang-kurangnya 3000 x 3000 piksel'); }
  ck(rel.primary.length > 0, 'PRIMARY_ARTIST_REQUIRED', 'Sekurang-kurangnya satu artis utama diperlukan');
  ck(rel.territories.length > 0, 'TERRITORY_REQUIRED', 'Pilih sekurang-kurangnya satu wilayah');
  const n = rel.tracks.length;
  ck(n > 0 && !((rel.type === 'single' && n > 3) || (rel.type === 'ep' && (n < 4 || n > 6)) || (rel.type === 'album' && n < 7)), 'TRACK_COUNT_MISMATCH', `Jenis ${typeName(rel.type)} tidak sesuai dengan ${n} lagu`);
  rel.tracks.forEach((t, i) => {
    const L = `Lagu ${i + 1}`;
    ck(!!t.title.trim(), 'TRACK_TITLE_REQUIRED', `${L}: tajuk diperlukan`);
    ck(/^[A-Z]{2}[A-Z0-9]{3}[0-9]{7}$/.test(t.isrc), 'TRACK_ISRC_REQUIRED', `${L}: ISRC sah diperlukan (12 aksara, cth. MYABC2600001)`);
    ck(!!t.audioPath, 'TRACK_AUDIO_REQUIRED', `${L}: fail audio (WAV atau FLAC) diperlukan`);
    if (t.audioPath) {
      ck(['wav', 'flac'].includes(t.format), 'TRACK_AUDIO_FORMAT', `${L}: format mesti WAV atau FLAC`);
      ck(t.rate >= 44100 && t.depth >= 16, 'TRACK_AUDIO_QUALITY', `${L}: audio mesti sekurang-kurangnya 16-bit / 44.1 kHz${t.rate ? '' : ' (tidak dapat dikesan)'}`);
      ck(t.dur > 0, 'TRACK_DURATION_REQUIRED', `${L}: tempoh tidak dapat dikesan`);
    }
    ck(!!(t.composer.trim() || t.lyricist.trim()), 'TRACK_SONGWRITER_REQUIRED', `${L}: komposer atau penulis lirik diperlukan`);
  });
  return { errors:E, total };
}

async function readAudio(f, url) {
  const ext = (f.name.split('.').pop() || '').toLowerCase(), out = { format:ext, rate:0, depth:0, dur:0 };
  try {
    const b = new DataView(await f.slice(0, 64).arrayBuffer());
    if (ext === 'wav' && b.getUint32(0) === 0x52494646 && b.getUint32(12) === 0x666d7420) { out.rate = b.getUint32(24, true); out.depth = b.getUint16(34, true); }
    else if (ext === 'flac' && b.getUint32(0) === 0x664c6143) {
      out.rate = (b.getUint8(18) << 12) | (b.getUint8(19) << 4) | (b.getUint8(20) >> 4);
      out.depth = (((b.getUint8(20) & 1) << 4) | (b.getUint8(21) >> 4)) + 1;
    }
  } catch (e) {}
  out.dur = await mediaDuration(f, 'audio');
  return out;
}
async function onFile(el) {

      setSave('Memuat naik…'); const [size, path] = await Promise.all([imageSize(f), uploadFile(f, 'covers')]);
      rel.coverPath = path; rel.cover = { w:size.w, h:size.h, name:f.name }; await saveRelease(rel); setSave('Disimpan');
      $('#coverBox').innerHTML = coverHTML(rel); refreshCheck();
    } else if (el.dataset.audio) {

      const [a, path] = await Promise.all([readAudio(f), uploadFile(f, 'audio')]);

    } else if (el.dataset.mv) {

      if (!a || !a.channelId) return toast('Pilih artis utama dahulu');

      const row = await must(sb.from('videos').insert({ channel_id:a.channelId, uploader_id:RV.user.id, type:t.mvType, title:`${t.title || 'Tanpa tajuk'} (${MV_LABEL[t.mvType]})`,

function onField(e) {

async function act(name) {
  const rel = curRel(); const run = async (fn, msg) => { try { await fn(); if (msg) toast(msg); await reload(); } catch (e) { toast(friendly(e)); } };
  if (name === 'submit') return run(() => must(sb.rpc('submit_release', { p_release:rel.id })), 'Release dihantar untuk semakan');
  if (name === 'approve') return run(() => must(sb.rpc('review_release', { p_release:rel.id, p_approve:true })), 'Release diluluskan');
  if (name === 'reject') { const why = ($('#rejWhy') || {}).value || ''; if (!why.trim()) return toast('Isi sebab penolakan'); return run(() => must(sb.rpc('review_release', { p_release:rel.id, p_approve:false, p_reason:why })), 'Release ditolak'); }
  if (name === 'publish') return run(() => must(sb.rpc('publish_release', { p_release:rel.id })), 'Release diterbitkan ke saluran artis');
  if (name === 'takedown') return run(() => must(sb.rpc('takedown_release', { p_release:rel.id })), 'Release ditarik balik');
  if (name === 'delrel') { UI.editing = null; return run(() => must(sb.from('releases').delete().eq('id', rel.id)), 'Draf dipadam'); }
}
async function newRelease() {
  if (!approved()) return;

    await must(sb.from('releases').insert({ id, distributor_id:ST.dist.id, title:'', label_name:ST.dist.name, language:'ms' }));
    await must(sb.from('tracks').insert({ release_id:id, position:1 }));
    await reload(false); UI.editing = id; render(); window.scrollTo(0, 0);

}

  }
  if ((el = t.closest('[data-rmmv]'))) {
    try { await must(sb.from('videos').delete().eq('id', el.dataset.rmmv)); ST.videos = ST.videos.filter(v => v.id !== el.dataset.rmmv); refreshTracks(); } catch (x) { toast(friendly(x)); }
    return;
  }
  if ((el = t.closest('[data-aprm]'))) {
    const [field, id] = el.dataset.aprm.split(':'), rel = curRel();
    rel[field] = rel[field].filter(x => x !== id);
    try { await syncArtists(rel); $(`[data-apf="${field}"]`).parentElement.outerHTML = apHTML(rel, field); refreshCheck(); } catch (x) { toast(friendly(x)); }
    return;
  }
  if ((el = t.closest('[data-api]'))) return;       // dikendalikan oleh mousedown
  if (!t.closest('.ap')) apClose();
  if (t.closest('[data-makekey]')) {
    try { UI.newKey = await must(sb.rpc('create_api_key', { p_distributor:ST.dist.id, p_name:'Kunci API' })); await reload(); } catch (x) { toast(friendly(x)); }
    return;
  }
  if ((el = t.closest('[data-revoke]'))) { try { await must(sb.rpc('revoke_api_key', { p_id:el.dataset.revoke })); await reload(); } catch (x) { toast(friendly(x)); } return; }
  if ((el = t.closest('[data-dstat]'))) { const [id, st] = el.dataset.dstat.split(':'); try { await must(sb.rpc('set_distributor_status', { p_id:id, p_status:st })); toast('Status dikemas kini'); await reload(); } catch (x) { toast(friendly(x)); } return; }
  if ((el = t.closest('[data-radm]'))) {
    const [id, a] = el.dataset.radm.split(':');
    try {
      if (a === 'publish') await must(sb.rpc('publish_release', { p_release:id }));
      else if (a === 'approve') await must(sb.rpc('review_release', { p_release:id, p_approve:true }));
      else { const why = prompt('Sebab penolakan:'); if (!why) return; await must(sb.rpc('review_release', { p_release:id, p_approve:false, p_reason:why })); }
      toast('Tindakan berjaya'); await reload();
    } catch (x) { toast(friendly(x)); }
    return;
  }
  if ((el = t.closest('[data-merge]'))) {
    const a = artistOf(el.dataset.merge);
    if (!ST.personal.length) return toast('Anda belum mempunyai saluran biasa. Cipta di Rocvid dahulu.');
    UI.merge = a.id; $('#mgArtist').textContent = a.name; $('#mgErr').textContent = '';
    $('#mgCh').innerHTML = ST.personal.map(id => `<option value="${id}">${esc(ST.channels[id].name)}</option>`).join(''); $('#mergeDlg').showModal(); return;
  }
  if ((el = t.closest('[data-unmerge]'))) {
    try { await must(sb.rpc('unmerge_artist_channel', { p_artist:el.dataset.unmerge })); toast('Artis dipisahkan dan mendapat saluran artis baharu'); await reload(); } catch (x) { toast(friendly(x)); }
    return;
  }
  if ((el = t.closest('[data-ach]'))) {
    const a = artistOf(el.dataset.ach), ch = ST.channels[a.channelId]; UI.ach = ch.id;
    $('#achT').textContent = `Edit saluran ${ch.name}`; $('#achBio').value = ch.bio || a.bio; $('#achAvatar').value = ''; $('#achBanner').value = ''; $('#achErr').textContent = ''; $('#achDlg').showModal();
  }
});
document.addEventListener('keydown', e => {
  const inp = e.target.closest && e.target.closest('[data-apin]');
  if (inp) {
    const U_ = UI.ap, n = U_.items.length;
    if (e.key === 'ArrowDown') { if (!U_.field) apSuggest(inp.dataset.apin); else { U_.idx = n ? (U_.idx + 1) % n : -1; apRender(); } e.preventDefault(); }
    else if (e.key === 'ArrowUp') { U_.idx = n ? (U_.idx - 1 + n) % n : -1; apRender(); e.preventDefault(); }
    else if (e.key === 'Enter') { if (U_.field && U_.idx >= 0) apPick(U_.idx); e.preventDefault(); }
    else if (e.key === 'Escape') apClose();
    else if (e.key === 'Backspace' && !inp.value) { const rel = curRel(), f = inp.dataset.apin; if (rel[f].length) { rel[f].pop(); syncArtists(rel).then(() => { $(`[data-apf="${f}"]`).parentElement.outerHTML = apHTML(rel, f); refreshCheck(); $(`[data-apin="${f}"]`).focus(); }); } }
    return;
  }
  if (e.key === 'Enter') { const o = e.target.closest && e.target.closest('[data-openrel]'); if (o && e.target === o) { UI.editing = o.dataset.openrel; render(); } }
});
document.addEventListener('mousedown', e => { const li = e.target.closest('[data-api]'); if (li) { e.preventDefault(); apPick(+li.dataset.api); } });
document.addEventListener('focusin', e => { const inp = e.target.closest && e.target.closest('[data-apin]'); if (inp && UI.ap.field !== inp.dataset.apin) apSuggest(inp.dataset.apin); });
document.addEventListener('input', onField);
document.addEventListener('change', onField);

/* Borang: syarikat, artis, gabung, edit saluran artis */
document.addEventListener('submit', async e => {
  e.preventDefault();
  const id = e.target.id;
  if (id === 'coForm') {
    const err = m => { $('#coErr').textContent = m; }, p = coPayload(), btn = $('#coGo');
    const need = [['name', 'Nama syarikat'], ['legal_name', 'Nama berdaftar'], ['registration_no', 'No. pendaftaran'], ['address', 'Alamat'], ['contact_person', 'Nama wakil'], ['contact_email', 'Emel perhubungan'], ['phone', 'Telefon']];
    for (const [k, l] of need) if (!String(p[k]).trim()) return err(`${l} diperlukan.`);
    if (!/^\S+@\S+\.\S+$/.test(p.contact_email.trim())) return err('Emel perhubungan tidak sah.');
    if (p.website.trim() && !/^https?:\/\//i.test(p.website.trim())) return err('Laman web mesti bermula dengan http:// atau https://');
    if (!ST.dist && !$('#coAgree').checked) return err('Anda mesti bersetuju dengan perjanjian pengedar.');
    btn.disabled = true; err('');
    try {
      if (ST.dist) await must(sb.rpc('update_distributor', { p_id:ST.dist.id, p }));
      else await must(sb.rpc('register_distributor', { p:{ ...p, agree:'true' } }));
      UI.editCo = false; toast(ST.dist ? 'Maklumat dikemas kini' : 'Pendaftaran dihantar. Menunggu kelulusan.'); await reload();
    } catch (x) { err(friendly(x)); btn.disabled = false; }
  } else if (id === 'artForm') {
    const err = m => { $('#aErr').textContent = m; }, name = $('#aName').value.trim(), btn = $('#aGo');
    if (!name) return err('Masukkan nama artis.');
    if (ST.artists.some(a => norm(a.name) === norm(name))) return err('Artis dengan nama ini sudah didaftarkan.');
    btn.disabled = true; err('');
    try {
      const a = await createArtist(name, $('#aCountry').value, $('#aBio').value.trim(), $('#aMerge').value);
      toast(`${a.name} didaftarkan${$('#aMerge').value ? ' dan digabungkan dengan saluran anda' : ' dengan saluran berlencana'}`); render();
    } catch (x) { err(friendly(x)); btn.disabled = false; }
  } else if (id === 'mergeForm') {
    const btn = $('#mgGo'); btn.disabled = true; $('#mgErr').textContent = '';
    try { await must(sb.rpc('merge_artist_channel', { p_artist:UI.merge, p_channel:$('#mgCh').value })); $('#mergeDlg').close(); toast('Saluran digabungkan. Muzik dan video akan diterbitkan di saluran ini.'); await reload(); }
    catch (x) { $('#mgErr').textContent = friendly(x); }
    btn.disabled = false;
  } else if (id === 'achForm') {
    const btn = $('#achGo'), av = $('#achAvatar').files[0], bn = $('#achBanner').files[0]; btn.disabled = true; $('#achErr').textContent = '';
    try {
      const patch = { bio:$('#achBio').value.trim() };
      if (av) { if (!av.type.startsWith('image/')) throw new Error('Gambar profil mesti fail imej'); patch.avatar_path = await uploadFile(av, 'avatars'); }
      if (bn) { if (!bn.type.startsWith('image/')) throw new Error('Sepanduk mesti fail imej'); patch.banner_path = await uploadFile(bn, 'banners'); }
      const rows = await must(sb.from('channels').update(patch).eq('id', UI.ach).select());
      if (!rows.length) throw new Error('Tidak dapat menyimpan saluran');
      ST.channels[UI.ach] = mapChannel(rows[0]); $('#achDlg').close(); toast('Saluran dikemas kini'); render();
    } catch (x) { $('#achErr').textContent = friendly(x); }
    btn.disabled = false;
  }
});

/* ================= Mula ================= */
async function onAuth() { await RV.claim(); await reload(false); RV.mountAuth(menuExtra()); const d = $('#loginDlg'); if (d && d.open) d.close(); render(); }
(async () => {
  initTheme();
  await loadSupabase();
  if (!CONFIGURED || !sb) { render(); return; }
  await RV.initAuth(onAuth);
  await RV.claim();
  await reload(false);
  RV.mountAuth(menuExtra()); render();
})();
</script>
