<!DOCTYPE html>
<html lang="ms" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Rocvid</title>
<style>
:root{
  --bg:#F4F3FA;--surface:#FFFFFF;--surface2:#ECEBF7;--ink:#12102A;--muted:#66647E;--line:#E3E1F0;
  --accent:#5148FF;--accent-ink:#FFFFFF;--sun:#FFC83D;--danger:#D62F4B;--ok:#16895F;
  --shadow:0 1px 2px rgba(20,16,60,.06),0 10px 30px rgba(20,16,60,.09);
  color-scheme:light;
}
:root[data-theme="dark"]{
  --bg:#0A0918;--surface:#14132B;--surface2:#1D1C3A;--ink:#F3F2FF;--muted:#A5A3C6;--line:#2A2950;
  --accent:#8B84FF;--accent-ink:#0A0918;--danger:#FF6B84;--ok:#3ECF94;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 12px 36px rgba(0,0,0,.45);
  color-scheme:dark;
}
*{box-sizing:border-box;margin:0}
body{font:15px/1.45 "Avenir Next","Segoe UI",system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
a{color:inherit}
.ic{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.flip{transform:scaleY(-1)}
.sr{position:absolute;opacity:0;width:1px;height:1px;overflow:hidden}
.ab{width:16px;height:16px;vertical-align:-3px;margin-left:5px;flex:none}
.rise{animation:rise .55s cubic-bezier(.2,.7,.2,1) both;animation-delay:calc(var(--i,0) * 45ms)}
@keyframes rise{from{opacity:0;transform:translateY(14px)}}

/* Header */
.top{position:sticky;top:0;z-index:30;height:68px;display:flex;align-items:center;gap:12px;padding:0 22px;background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.logo{display:flex;align-items:center;gap:10px;font-weight:850;font-size:25px;letter-spacing:-.05em;color:inherit;text-decoration:none}
.logo svg{width:36px;height:36px}
.search{flex:1;max-width:600px;margin:0 auto;display:flex;border:1px solid var(--line);border-radius:999px;background:var(--surface);overflow:hidden;box-shadow:var(--shadow)}
.search input{flex:1;min-width:0;border:0;background:none;padding:11px 20px;outline:none}
.search:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 28%,transparent)}
.search button{border:0;background:none;color:var(--muted);padding:0 18px;cursor:pointer}
.btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:9px 18px;font-weight:650;cursor:pointer;text-decoration:none;white-space:nowrap}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.sun{background:var(--sun);color:#15132B;border-color:var(--sun)}
.btn.ghost{background:none}
.btn.sm{padding:5px 12px;font-size:13px}
.btn.danger{color:var(--danger);border-color:var(--danger)}
.btn[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn:disabled{opacity:.5;cursor:wait}
.btn .ic{width:20px;height:20px}
.iconbtn{width:42px;height:42px;padding:0;justify-content:center}

/* Layout */
.shell{display:grid;grid-template-columns:228px minmax(0,1fr);min-height:calc(100vh - 68px)}
.rail{position:sticky;top:68px;align-self:start;display:flex;flex-direction:column;gap:3px;padding:16px 12px;max-height:calc(100vh - 68px);overflow:auto}
.rail a{display:flex;align-items:center;gap:14px;padding:11px 14px;border-radius:14px;color:inherit;text-decoration:none;font-weight:560}
.rail a:hover{background:var(--surface)}
.rail a[aria-current="page"]{background:var(--surface);font-weight:720;box-shadow:inset 3px 0 0 var(--accent)}
.rail hr{border:0;border-top:1px solid var(--line);margin:10px 8px}
.rail a.studio{background:linear-gradient(135deg,color-mix(in srgb,var(--sun) 24%,transparent),transparent);border:1px solid color-mix(in srgb,var(--sun) 50%,var(--line))}
main{padding:24px 30px 56px;min-width:0}
.ph{font-size:28px;font-weight:850;letter-spacing:-.035em;margin-bottom:16px}
.found{color:var(--muted);margin-bottom:14px}
.sh{display:flex;justify-content:space-between;align-items:baseline;margin:32px 0 14px}
.sh h2{font-size:21px;font-weight:800;letter-spacing:-.03em;display:flex;align-items:center;gap:8px}
.sh a{color:var(--muted);font-size:14px;font-weight:600;text-decoration:none}
.sh .ab{width:22px;height:22px;margin:0}

/* Hero */
.hero{position:relative;border-radius:28px;overflow:hidden;aspect-ratio:21/9;min-height:270px;background:#0A0918;color:#fff;margin-bottom:24px;box-shadow:var(--shadow)}
.slide{position:absolute;inset:0;opacity:0;visibility:hidden;transition:opacity .8s,visibility .8s;cursor:pointer;display:flex;align-items:flex-end}
.slide.on{opacity:1;visibility:visible}
.sbg{position:absolute;inset:0;background:var(--g)}
.sbg video,.sbg img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.shade{position:absolute;inset:0;background:linear-gradient(90deg,rgba(6,5,20,.9),rgba(6,5,20,.4) 55%,rgba(6,5,20,.05)),linear-gradient(0deg,rgba(6,5,20,.75),transparent 50%)}
.copy{position:relative;padding:36px 42px 58px;max-width:700px;display:grid;gap:12px;justify-items:start}
.copy h1{font-size:clamp(26px,4.2vw,52px);line-height:1.04;font-weight:860;letter-spacing:-.045em}
.copy .who{display:flex;gap:10px;align-items:center;color:rgba(255,255,255,.88);flex-wrap:wrap}
.tag{display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.16);backdrop-filter:blur(8px);border-radius:999px;padding:4px 12px;font-size:13px;font-weight:650}
.dots{position:absolute;left:42px;bottom:22px;display:flex;gap:8px;z-index:2}
.dot{position:relative;width:38px;height:4px;border-radius:4px;background:rgba(255,255,255,.3);border:0;padding:0;cursor:pointer;overflow:hidden}
.dot i{position:absolute;inset:0;background:var(--sun);transform-origin:left;transform:scaleX(0)}
.dot.on i{animation:fill 8s linear forwards}
.dot.done i{transform:scaleX(1)}
@keyframes fill{to{transform:scaleX(1)}}

.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 6px;scrollbar-width:none}
.chip{flex:none;display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 16px;cursor:pointer;font-weight:560;text-decoration:none}
.chip i{width:8px;height:8px;border-radius:50%;background:var(--c,var(--muted))}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}

/* Kad video */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:32px 20px}
.card{cursor:pointer;border-radius:18px}
.thumb{position:relative;aspect-ratio:16/9;border-radius:18px;overflow:hidden;background:var(--g);box-shadow:var(--shadow)}
.thumb video,.thumb img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.thumb .pv{opacity:0;transition:opacity .3s}
.thumb .pv.on{opacity:1}
.pl{position:absolute;inset:0;margin:auto;width:50px;height:50px;border-radius:50%;background:var(--sun);color:#15132B;display:grid;place-items:center;opacity:0;pointer-events:none;transform:scale(.8);transition:opacity .2s,transform .2s}
.pl .ic{width:22px;height:22px;margin-left:2px}
@media (hover:hover){
  .card:hover .thumb,.sq:hover .cov{transform:translateY(-3px)}
  .sq:hover .pl,.rc:hover .pl{opacity:1;transform:none}
}
.thumb,.cov{transition:transform .25s}
.dur{position:absolute;right:10px;bottom:10px;background:rgba(0,0,0,.8);color:#fff;font-size:12px;font-weight:650;padding:2px 7px;border-radius:6px}
.dur:empty{display:none}
.badge{position:absolute;left:10px;top:10px;background:var(--sun);color:#15132B;font-size:12px;font-weight:750;padding:3px 9px;border-radius:7px}
.meta{display:flex;gap:12px;padding-top:12px}
.av{flex:none;width:40px;height:40px;border-radius:50%;background:var(--g);display:grid;place-items:center;color:#fff;font-weight:750;text-decoration:none;overflow:hidden}
.av img{width:100%;height:100%;object-fit:cover}
.av.lg{width:92px;height:92px;font-size:38px;border:4px solid var(--surface)}
.meta h3,.rc h3{font-size:15.5px;font-weight:680;line-height:1.3;letter-spacing:-.01em;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.ch,.st,.muted{color:var(--muted);font-size:13px}
.chl{text-decoration:none}
.chl:hover{text-decoration:underline}
.st{display:flex;gap:12px;flex-wrap:wrap}

/* Rak muzik dan artis */
.shelf{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(158px,184px);gap:18px;overflow-x:auto;padding:4px 2px 12px;scrollbar-width:thin}
.sqgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:22px 18px}
.sq{cursor:pointer}
.cov{position:relative;aspect-ratio:1;border-radius:18px;overflow:hidden;background:var(--g);margin-bottom:10px;box-shadow:var(--shadow)}
.cov img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.sq h3{font-size:15.5px;font-weight:680;line-height:1.3;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.artists{display:flex;gap:24px;overflow-x:auto;padding:4px 2px 12px;scrollbar-width:thin}
.ar{flex:none;width:112px;text-align:center;color:inherit;text-decoration:none}
.ar .pic{position:relative;width:112px;height:112px;border-radius:50%;background:var(--g);display:grid;place-items:center;font-size:44px;font-weight:800;color:#fff;box-shadow:var(--shadow);margin-bottom:10px;transition:transform .25s}
.ar .pic img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;border-radius:50%}
.ar:hover .pic{transform:scale(1.04)}
.ar .ab{position:absolute;right:-2px;bottom:2px;width:34px;height:34px;margin:0;filter:drop-shadow(0 2px 4px rgba(0,0,0,.35));z-index:1}
.ar strong{display:block;font-weight:680;font-size:14.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.promo{display:flex;align-items:center;gap:16px;padding:18px 20px;border-radius:20px;border:1px solid color-mix(in srgb,var(--sun) 50%,var(--line));background:linear-gradient(135deg,color-mix(in srgb,var(--sun) 18%,var(--surface)),var(--surface));margin-top:32px;flex-wrap:wrap}
.promo .ab{width:44px;height:44px;margin:0}
.promo div{flex:1;min-width:200px}
.promo p{color:var(--muted);font-size:14px}

.empty{max-width:440px;margin:70px auto;text-align:center}
.empty h2{font-size:20px;margin-bottom:6px}
.empty p{color:var(--muted);margin-bottom:18px}

/* Saluran */
.chead{border-radius:26px;overflow:hidden;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow)}
.cbanner{height:150px;background:var(--g);position:relative}
.cbanner img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.cinfo{display:flex;align-items:flex-end;gap:20px;padding:0 26px 24px;margin-top:-40px;flex-wrap:wrap}
.cmain{flex:1;min-width:230px;padding-top:44px}
.cmain h1{font-size:30px;font-weight:850;letter-spacing:-.04em;line-height:1.1;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.cmain h1 .ab{width:26px;height:26px;margin:0}
.cmain p{max-width:60ch;margin-top:6px}
.cact{display:flex;gap:8px;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:700;padding:3px 12px 3px 8px;border-radius:999px;background:color-mix(in srgb,var(--sun) 22%,transparent);border:1px solid color-mix(in srgb,var(--sun) 55%,transparent)}
.pill .ab{width:18px;height:18px;margin:0}

/* Halaman tonton */
.watch{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:28px;max-width:1500px}
.watch.theater{grid-template-columns:1fr}
.watch h1{font-size:23px;line-height:1.3;font-weight:780;letter-spacing:-.03em;margin:16px 0 12px}
.mtabs{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.wrow{display:flex;flex-wrap:wrap;gap:14px;justify-content:space-between;align-items:center}
.chan{display:flex;align-items:center;gap:12px}
.chan small{display:block;color:var(--muted)}
.acts{display:flex;gap:8px;flex-wrap:wrap}
.seg{display:inline-flex}
.seg .btn:first-child{border-radius:999px 0 0 999px}
.seg .btn:last-child{border-radius:0 999px 999px 0;border-left:0}
.desc{margin-top:16px;padding:18px;background:var(--surface);border:1px solid var(--line);border-radius:18px}
.desc .st{color:var(--ink);font-weight:650;margin-bottom:6px;font-size:14px}
.desc p{max-width:75ch}
.mi{display:grid;grid-template-columns:max-content 1fr;gap:5px 20px;margin-top:14px;padding-top:14px;border-top:1px solid var(--line);font-size:14px}
.mi dt{color:var(--muted)}
.mi dd{margin:0;overflow-wrap:anywhere}
.cm{margin-top:28px}
.cm h2{font-size:18px;margin-bottom:14px}
.cform{display:flex;gap:10px;align-items:flex-start;margin-bottom:22px}
.cform textarea{flex:1;min-height:44px;resize:vertical;border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:10px 14px}
.c{display:flex;gap:12px;margin-bottom:18px}
.c b{font-weight:680}
.c .when{color:var(--muted);font-size:13px;margin-left:8px}
.c p{max-width:75ch;overflow-wrap:anywhere}
.relh{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.relh h2{font-size:18px}
.rc{display:grid;grid-template-columns:172px 1fr;gap:12px;margin-bottom:16px;cursor:pointer;border-radius:14px}
.rc .thumb{border-radius:14px;box-shadow:none}
.sw{display:inline-flex;align-items:center;gap:10px;font-size:13px;font-weight:600;cursor:pointer;justify-content:space-between}
.sw input{appearance:none;width:36px;height:20px;border-radius:99px;background:var(--line);position:relative;cursor:pointer;transition:background .2s;flex:none}
.sw input::after{content:"";position:absolute;top:3px;left:3px;width:14px;height:14px;border-radius:50%;background:#fff;transition:transform .2s}
.sw input:checked{background:var(--accent)}
.sw input:checked::after{transform:translateX(16px)}

/* ===== Pemain video Rocvid ===== */
.rp{position:relative;aspect-ratio:16/9;max-height:80vh;width:100%;background:#000;border-radius:22px;overflow:hidden;color:#fff;outline:none;user-select:none;-webkit-user-select:none;box-shadow:var(--shadow);--sun:#FFC83D}
.watch.theater .rp{border-radius:0}
.rp:fullscreen,.rp.pfs{max-height:none;border-radius:0;aspect-ratio:auto}
.rp.pfs{position:fixed;inset:0;z-index:100;width:100%;height:100%}
.rp-media{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#000}
.rp audio.rp-media{display:none}
.rp-hit{position:absolute;inset:0}
.rp.idle{cursor:none}
.rp-shade{position:absolute;left:0;right:0;bottom:0;height:34%;background:linear-gradient(0deg,rgba(0,0,0,.78),transparent);pointer-events:none;transition:opacity .3s}
.rp-ctrl{position:absolute;left:0;right:0;bottom:0;padding:0 14px 8px;transition:opacity .3s}
.rp.idle .rp-ctrl,.rp.idle .rp-shade{opacity:0;pointer-events:none}
.rp-bar{position:relative;height:22px;display:flex;align-items:center;cursor:pointer;touch-action:none;outline:none}
.rp-track{position:relative;width:100%;height:4px;border-radius:4px;background:rgba(255,255,255,.22);transition:height .12s}
.rp-bar:hover .rp-track,.rp-bar:focus-visible .rp-track,.rp.scrub .rp-track{height:7px}
.rp-buf,.rp-played{position:absolute;left:0;top:0;bottom:0;border-radius:4px;width:0}
.rp-buf{background:rgba(255,255,255,.38)}
.rp-played{background:var(--sun)}
.rp-knob{position:absolute;top:50%;left:0;width:15px;height:15px;margin:-7.5px 0 0 -7.5px;border-radius:50%;background:var(--sun);box-shadow:0 0 0 4px rgba(255,200,61,.3);transform:scale(0);transition:transform .12s}
.rp-bar:hover .rp-knob,.rp-bar:focus-visible .rp-knob,.rp.scrub .rp-knob{transform:scale(1)}
.rp-tip{position:absolute;bottom:26px;left:0;transform:translateX(-50%);display:grid;justify-items:center;gap:4px;opacity:0;pointer-events:none;transition:opacity .12s}
.rp-pv{width:168px;aspect-ratio:16/9;object-fit:cover;border-radius:10px;border:2px solid #fff;background:#111}
.rp-tip span{background:rgba(0,0,0,.82);padding:2px 8px;border-radius:6px;font-size:12.5px;font-weight:650;font-variant-numeric:tabular-nums}
.rp-row{display:flex;align-items:center;gap:2px}
.rp-row button{background:none;border:0;color:#fff;width:42px;height:42px;display:grid;place-items:center;border-radius:50%;cursor:pointer}
.rp-row button:hover{background:rgba(255,255,255,.14)}
.rp-row button:focus-visible{outline:2px solid var(--sun)}
.rp-row button[aria-pressed="true"]{color:var(--sun)}
.rp-row .ic{width:24px;height:24px}
.rp-time{font-size:13.5px;font-weight:600;font-variant-numeric:tabular-nums;margin:0 10px;white-space:nowrap}
.rp-row .sp{flex:1}
.rp-vol{display:flex;align-items:center}
.rp-vol input{width:0;opacity:0;transition:width .2s,opacity .2s;accent-color:var(--sun);height:4px;cursor:pointer}
.rp-vol:hover input,.rp-vol:focus-within input{width:76px;opacity:1;margin:0 8px 0 2px}
.rp-big{position:absolute;inset:0;margin:auto;width:78px;height:78px;border-radius:50%;border:0;background:var(--sun);color:#15132B;display:none;place-items:center;cursor:pointer;box-shadow:0 10px 40px rgba(0,0,0,.45)}
.rp-big .ic{width:34px;height:34px;margin-left:3px}
.rp[data-state="paused"] .rp-big,.rp[data-state="ended"] .rp-big{display:grid}
.rp.buf .rp-big,.rp.err .rp-big{display:none}
.rp-flash{position:absolute;inset:0;margin:auto;width:76px;height:76px;border-radius:50%;background:rgba(0,0,0,.6);display:grid;place-items:center;font-weight:750;font-size:18px;opacity:0;pointer-events:none}
.rp-flash.go{animation:flash .6s ease-out}
.rp-flash .ic{width:34px;height:34px}
@keyframes flash{0%{opacity:.95;transform:scale(.8)}100%{opacity:0;transform:scale(1.35)}}
.rp-ripple{position:absolute;top:0;bottom:0;width:30%;display:grid;place-items:center;font-weight:700;background:rgba(255,255,255,.14);opacity:0;pointer-events:none}
.rp-ripple.l{left:0;border-radius:0 80% 80% 0}
.rp-ripple.r{right:0;border-radius:80% 0 0 80%}
.rp-ripple.go{animation:rip .6s ease-out}
@keyframes rip{0%{opacity:1}100%{opacity:0}}
.rp-spin{position:absolute;inset:0;margin:auto;width:54px;height:54px;border-radius:50%;border:4px solid rgba(255,255,255,.25);border-top-color:var(--sun);animation:spin .8s linear infinite;display:none;pointer-events:none}
.rp.buf .rp-spin{display:block}
@keyframes spin{to{transform:rotate(360deg)}}
.rp-err{position:absolute;inset:0;display:grid;place-content:center;justify-items:center;gap:12px;background:rgba(0,0,0,.75);text-align:center;padding:20px}
.rp-err[hidden]{display:none}
.rp-menu{position:absolute;right:14px;bottom:72px;width:262px;background:rgba(14,13,34,.94);backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,.14);border-radius:16px;padding:14px;display:grid;gap:12px;z-index:3}
.rp-menu[hidden]{display:none}
.rp-menu .mh{font-size:12.5px;font-weight:700;color:rgba(255,255,255,.65)}
.speeds{display:flex;flex-wrap:wrap;gap:6px}
.speeds button{border:1px solid rgba(255,255,255,.2);background:none;color:#fff;border-radius:999px;padding:4px 11px;cursor:pointer;font-size:13px}
.speeds button[aria-pressed="true"]{background:var(--sun);color:#15132B;border-color:var(--sun)}
.rp-menu .sw{color:#fff}
.rp.audio{background:#0A0918}
.rp-cover{position:absolute;inset:0;background:var(--g)}
.rp-bg{position:absolute;inset:-30px;background-size:cover;background-position:center;filter:blur(40px) brightness(.55)}
.rp-cover img{position:absolute;top:7%;left:50%;transform:translateX(-50%);height:66%;aspect-ratio:1;border-radius:18px;object-fit:cover;box-shadow:0 16px 50px rgba(0,0,0,.55)}
.eq{position:absolute;left:50%;bottom:22%;transform:translateX(-50%);display:flex;gap:5px;align-items:flex-end;height:30px}
.eq i{width:5px;height:6px;border-radius:3px;background:var(--sun)}
.rp[data-state="playing"] .eq i{animation:eq .9s ease-in-out infinite alternate}
.eq i:nth-child(2){animation-delay:.15s!important}.eq i:nth-child(3){animation-delay:.3s!important}.eq i:nth-child(4){animation-delay:.45s!important}.eq i:nth-child(5){animation-delay:.6s!important}
@keyframes eq{to{height:28px}}
.rp.audio .rp-shade{height:45%}

/* Borang dan dialog */
.f{display:grid;gap:6px;font-weight:600;font-size:14px;align-content:start}
.f input,.f select,.f textarea{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:10px 12px;font-weight:400}
.f small{color:var(--muted);font-weight:400}
.drop{display:block;border:2px dashed var(--line);border-radius:14px;padding:22px 14px;text-align:center;cursor:pointer;background:var(--bg);font-weight:600}
.drop:hover,.drop:focus-within{border-color:var(--accent)}
.drop small{display:block;color:var(--muted);font-weight:400;margin-top:2px}
.chk{display:flex;gap:10px;align-items:flex-start;font-weight:400;font-size:14px}
.chk input{margin-top:4px}
.err{color:var(--danger);font-weight:600;min-height:1.2em;font-size:14px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.reasons{display:grid;gap:8px}
.reasons label{display:flex;gap:10px;align-items:center;font-weight:500}
.linked{display:flex;gap:8px;align-items:center;padding:10px 12px;border-radius:12px;background:var(--bg);border:1px solid var(--line);font-size:14px}
.linked .ic{width:18px;height:18px;color:var(--accent)}

@media (prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important}
  .dot.on i{transform:scaleX(1)}
}
@media (max-width:1100px){.watch{grid-template-columns:1fr}}
@media (max-width:860px){
  .shell{grid-template-columns:1fr}
  .rail{position:fixed;left:0;right:0;bottom:0;top:auto;flex-direction:row;justify-content:space-around;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(12px);border-top:1px solid var(--line);padding:6px;z-index:25;max-height:none;overflow:visible}
  .rail a{flex-direction:column;gap:2px;font-size:11px;padding:6px 8px;text-align:center;border-radius:12px}
  .rail a[aria-current="page"]{box-shadow:none;background:none;color:var(--accent)}
  .rail .desk,.rail hr{display:none}
  main{padding:16px 14px 96px}
  .top{padding:0 12px;gap:8px}
  .top .upl span,.top .gbtn span{display:none}
  .top .upl{padding:10px}
  .logo span{display:none}
  .two{grid-template-columns:1fr}
  .grid{grid-template-columns:1fr}
  .hero{aspect-ratio:4/5;min-height:0;border-radius:22px}
  .copy{padding:22px 20px 56px}
  .dots{left:20px}
  .rc{grid-template-columns:150px 1fr}
  .rp{border-radius:14px}
  .rp-vol input{display:none}
  .rp-time{margin:0 4px;font-size:12.5px}
  .rp-row button{width:38px;height:38px}
}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
  <linearGradient id="abGrad" gradientUnits="userSpaceOnUse" x1="2" y1="2" x2="22" y2="22"><stop offset="0" stop-color="#FFE08A"/><stop offset="1" stop-color="#FF9F43"/></linearGradient>
</defs></svg>

<header class="top">
  <a class="logo" href="#/home" aria-label="Rocvid, ke laman utama">
    <svg viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="10" fill="var(--accent)"/><path d="M12 8.5l12 7.5-12 7.5z" fill="var(--accent-ink)"/><circle cx="7.2" cy="24.8" r="2.3" fill="var(--sun)"/></svg>
    <span>rocvid</span>
  </a>
  <form class="search" role="search" id="sf">
    <input id="q" type="search" placeholder="Cari video, lagu atau artis" aria-label="Cari video, lagu atau artis" autocomplete="off">
    <button type="submit" aria-label="Cari"><svg class="ic" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M21 21l-5-5"/></svg></button>
  </form>
  <button class="btn iconbtn" id="themeBtn" aria-label="Tukar tema gelap atau cerah"></button>
  <button class="btn sun upl" data-upload aria-label="Muat naik video">
    <svg class="ic" viewBox="0 0 24 24"><path d="M12 16V4M7 9l5-5 5 5M4 20h16"/></svg><span>Muat naik</span>
  </button>
  <div id="auth"></div>
</header>

<div class="shell">
  <nav class="rail" id="rail" aria-label="Navigasi utama"></nav>
  <main id="main"><div class="empty"><p>Memuatkan…</p></div></main>
</div>

<dialog id="upDlg" aria-labelledby="upT">
  <form id="upForm" novalidate>
    <header><h2 id="upT">Muat naik video</h2><button type="button" class="x" data-close aria-label="Tutup"><svg class="ic" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button></header>
    <label class="drop" for="fVid"><span id="fName">Pilih fail video</span><small id="fLimit">MP4, WebM atau MOV.</small></label>
    <input class="sr" id="fVid" type="file" accept="video/*">
    <label class="f">Tajuk<input id="fTitle" type="text" maxlength="100"></label>
    <label class="f">Penerangan<textarea id="fDesc" rows="3" maxlength="2000"></textarea></label>
    <div class="two">
      <label class="f">Saluran<select id="fCh"></select></label>
      <label class="f">Kategori<select id="fCat"></select></label>
    </div>
    <label class="f">Privasi<select id="fPriv"><option value="public">Awam</option><option value="unlisted">Tidak tersenarai</option><option value="private">Peribadi</option></select></label>
    <label class="f">Gambar kecil (pilihan)<input id="fThumb" type="file" accept="image/*"></label>
    <label class="chk"><input type="checkbox" id="fOwn"><span>Saya pemilik video ini atau mempunyai kebenaran untuk menggunakannya.</span></label>
    <p class="err" id="fErr" role="alert"></p>
    <footer><button type="button" class="btn" data-close>Batal</button><button type="submit" class="btn primary" id="fGo">Terbitkan</button></footer>
  </form>
</dialog>

<dialog id="chDlg" aria-labelledby="chT">
  <form id="chForm" novalidate>
    <header><h2 id="chT">Cipta saluran</h2><button type="button" class="x" data-close aria-label="Tutup"><svg class="ic" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button></header>
    <div class="linked"><svg class="ic" viewBox="0 0 24 24"><path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/></svg><span>Dipaut ke akaun <b id="cEmail"></b></span></div>
    <label class="f">Nama saluran<input id="cName" type="text" maxlength="80" autocomplete="off"></label>
    <label class="f">Nama pengguna saluran<input id="cHandle" type="text" maxlength="40" autocomplete="off" placeholder="cth. nama-saya"><small id="cHint">Digunakan dalam pautan: #/channel/nama-pengguna. Tidak boleh ditukar kemudian.</small></label>
    <label class="f">Perihal (pilihan)<textarea id="cBio" rows="3" maxlength="500"></textarea></label>
    <div class="two">
      <label class="f">Gambar profil<input id="cAvatar" type="file" accept="image/*"></label>
      <label class="f">Sepanduk<input id="cBanner" type="file" accept="image/*"></label>
    </div>
    <p class="err" id="cErr" role="alert"></p>
    <footer><button type="button" class="btn" data-close>Batal</button><button type="submit" class="btn primary" id="cGo">Simpan</button></footer>
  </form>
</dialog>

<dialog id="rpDlg" aria-labelledby="rpT">
  <form id="rpForm">
    <header><h2 id="rpT">Lapor kandungan</h2><button type="button" class="x" data-close aria-label="Tutup"><svg class="ic" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button></header>
    <div class="reasons">
      <label><input type="radio" name="why" value="spam" checked> Spam atau mengelirukan</label>
      <label><input type="radio" name="why" value="adult"> Kandungan dewasa</label>
      <label><input type="radio" name="why" value="violence"> Keganasan atau kebencian</label>
      <label><input type="radio" name="why" value="copyright"> Pelanggaran hak cipta</label>
      <label><input type="radio" name="why" value="other"> Lain-lain</label>
    </div>
    <footer><button type="button" class="btn" data-close>Batal</button><button type="submit" class="btn primary">Hantar laporan</button></footer>
  </form>
</dialog>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="rocvid-core.js"></script>
<script>
/* ================= Data ================= */
const CATS = ['Semua', 'Hiburan', 'Muzik', 'Pendidikan', 'Permainan', 'Vlog', 'Teknologi', 'Makanan'];
const CAT_COLOR = { Hiburan:'#FF6B6B', Muzik:'#8F88FF', Pendidikan:'#34C3A0', Permainan:'#FFB020', Vlog:'#FF7AB6', Teknologi:'#4FC3F7', Makanan:'#FF8A4C' };
const MV_LABEL = { official_music_video:'Video rasmi', lyric_video:'Video lirik', visualizer:'Visualizer', live_performance:'Persembahan langsung' };
const PRIV = { public:'Awam', unlisted:'Tidak tersenarai', private:'Peribadi' };
const NAV = [
  ['home','Utama','home'], ['trending','Sedang hangat','flame'], ['music','Muzik','music'], ['subs','Langganan','users'],
  ['later','Tonton nanti','bookmark','desk'], ['liked','Disukai','thumb','desk'], ['history','Sejarah','clock','desk'], ['mine','Video saya','film']
];
const VIEWS = NAV.map(n => n[0]);
const NEEDS_LOGIN = { subs:'melihat langganan anda', later:'melihat video simpanan', liked:'melihat video disukai', history:'melihat sejarah tontonan', mine:'melihat video anda' };

const S = { channels:{}, videos:[], artists:[], releases:[], comments:{}, myCh:[], me:{ liked:[], disliked:[], later:[], subs:[], history:[] } };
const UI = { view:'home', cat:'Semua', q:'', current:null, cd:false, chHandle:null, theater:false, chEdit:null };
const PREFS = Object.assign({ vol:1, muted:false, rate:1, autonext:true }, LS.get('rv_prefs', {}));
const savePrefs = () => LS.set('rv_prefs', PREFS);
let destroyPlayer = null, heroTimer = null, pvEl = null;

const byId = id => S.videos.find(v => v.id === id);
const chOf = v => S.channels[v.chId] || { id:v.chId, name:'Saluran', handle:'', badge:false, subs:0, avatar:'' };
const vis = v => v.privacy === 'public' && v.status === 'ready';
const isMine = v => !!RV.user && (v.uploader === RV.user.id || (S.channels[v.chId] || {}).owner === RV.user.id);
const myChannel = ch => !!RV.user && ch.owner === RV.user.id;
const has = (k, id) => S.me[k].includes(id);
const setBusy = (btn, on, label) => { btn.disabled = on; if (label) btn.textContent = on ? label : btn.dataset.label; };

/* ================= Muat data ================= */
async function loadPublic() {
  const [vids, chans, arts, rels] = await Promise.all([
    must(sb.from('videos').select('*').eq('status', 'ready').eq('privacy', 'public').order('created_at', { ascending:false }).limit(300)),
    must(sb.from('channels').select('*')),
    must(sb.from('artists').select('*')),
    must(sb.from('releases').select('*').eq('status', 'live'))
  ]);
  S.channels = {}; chans.forEach(c => { S.channels[c.id] = mapChannel(c); });
  S.videos = vids.map(mapVideo);
  S.artists = arts.map(a => ({ id:a.id, name:a.name, channelId:a.channel_id, bio:a.bio || '', country:a.country }));
  const ids = rels.map(r => r.id); let trs = [], ras = [];
  if (ids.length) [trs, ras] = await Promise.all([must(sb.from('tracks').select('*').in('release_id', ids)), must(sb.from('release_artists').select('*').in('release_id', ids))]);
  S.releases = rels.map(r => ({ id:r.id, title:r.title, version:r.version_title || '', label:r.label_name, genre:r.genre, p:r.p_line, c:r.c_line,
    primary:ras.filter(x => x.release_id === r.id && x.role === 'primary').map(x => x.artist_id),
    featured:ras.filter(x => x.release_id === r.id && x.role === 'featured').map(x => x.artist_id),
    tracks:trs.filter(t => t.release_id === r.id).map(t => ({ id:t.id, isrc:t.isrc, composer:t.composer, lyricist:t.lyricist, producer:t.producer, publisher:t.publisher })) }));
}
async function loadMine() {
  S.me = { liked:[], disliked:[], later:[], subs:[], history:[] }; S.myCh = [];
  if (!RV.user) return;
  const uid = RV.user.id;
  const [mine, votes, subs, saved, hist] = await Promise.all([
    must(sb.from('channels').select('*').eq('owner_id', uid)),
    must(sb.from('video_votes').select('video_id,value').eq('user_id', uid)),
    must(sb.from('subscriptions').select('channel_id').eq('user_id', uid)),
    must(sb.from('saved_videos').select('video_id').eq('user_id', uid)),
    must(sb.from('watch_history').select('video_id,watched_at').eq('user_id', uid).order('watched_at', { ascending:false }).limit(100))
  ]);
  mine.forEach(c => { S.channels[c.id] = mapChannel(c); });
  S.myCh = mine.filter(c => c.kind === 'personal').map(c => c.id);
  const ids = mine.map(c => c.id);
  if (ids.length) {
    const own = await must(sb.from('videos').select('*').in('channel_id', ids).order('created_at', { ascending:false }));
    own.map(mapVideo).forEach(v => { const i = S.videos.findIndex(x => x.id === v.id); if (i >= 0) S.videos[i] = v; else S.videos.push(v); });
  }
  S.me.liked = votes.filter(x => x.value === 1).map(x => x.video_id);
  S.me.disliked = votes.filter(x => x.value === -1).map(x => x.video_id);
  S.me.subs = subs.map(x => x.channel_id); S.me.later = saved.map(x => x.video_id); S.me.history = hist.map(x => x.video_id);
}
async function resync() { try { await loadPublic(); await loadMine(); } catch (e) { toast(friendly(e)); } render(); }
async function ensureVideo(id) {
  let v = byId(id); if (v) return v;
  try {
    const rows = await must(sb.rpc('get_video', { p_id:id }));
    if (rows && rows[0]) { v = mapVideo(rows[0]); S.videos.push(v); await ensureChannelById(v.chId); return v; }
  } catch (e) {}
  return null;
}
async function ensureChannelById(id) {
  if (S.channels[id]) return S.channels[id];
  try { const r = await must(sb.from('channels').select('*').eq('id', id).maybeSingle()); if (r) S.channels[id] = mapChannel(r); } catch (e) {}
  return S.channels[id];
}
async function ensureChannel(handle) {
  let c = Object.values(S.channels).find(x => x.handle === handle); if (c) return c;
  try { const r = await must(sb.from('channels').select('*').eq('handle', handle).maybeSingle()); if (r) { c = S.channels[r.id] = mapChannel(r); } } catch (e) {}
  return c || null;
}

/* ================= Tindakan pengguna ================= */
async function setVote(v, val) {
  if (!RV.need('menilai video')) return;
  const had = has('liked', v.id) ? 1 : has('disliked', v.id) ? -1 : 0, next = had === val ? 0 : val;
  if (had === 1) { v.likes--; S.me.liked = S.me.liked.filter(x => x !== v.id); }
  if (had === -1) { v.dislikes--; S.me.disliked = S.me.disliked.filter(x => x !== v.id); }
  if (next === 1) { v.likes++; S.me.liked.push(v.id); }
  if (next === -1) { v.dislikes++; S.me.disliked.push(v.id); }
  refreshWatch();
  try {
    if (next === 0) await must(sb.from('video_votes').delete().eq('video_id', v.id).eq('user_id', RV.user.id));
    else await must(sb.from('video_votes').upsert({ video_id:v.id, user_id:RV.user.id, value:next }, { onConflict:'video_id,user_id' }));
  } catch (e) { toast(friendly(e)); resync(); }
}
async function toggleSub(chId) {
  if (!RV.need('melanggan saluran')) return;
  const ch = S.channels[chId], on = !has('subs', chId);
  S.me.subs = on ? [...S.me.subs, chId] : S.me.subs.filter(x => x !== chId); ch.subs += on ? 1 : -1;
  toast(on ? 'Anda melanggan ' + ch.name : 'Langganan dibatalkan');
  UI.view === 'channel' ? renderChannel() : refreshWatch();
  try {
    if (on) await must(sb.from('subscriptions').insert({ user_id:RV.user.id, channel_id:chId }));
    else await must(sb.from('subscriptions').delete().eq('user_id', RV.user.id).eq('channel_id', chId));
  } catch (e) { toast(friendly(e)); resync(); }
}
async function toggleSaved(v) {
  if (!RV.need('menyimpan video')) return;
  const on = !has('later', v.id);
  S.me.later = on ? [...S.me.later, v.id] : S.me.later.filter(x => x !== v.id);
  toast(on ? 'Disimpan ke Tonton nanti' : 'Dibuang daripada Tonton nanti'); refreshWatch();
  try {
    if (on) await must(sb.from('saved_videos').insert({ user_id:RV.user.id, video_id:v.id }));
    else await must(sb.from('saved_videos').delete().eq('user_id', RV.user.id).eq('video_id', v.id));
  } catch (e) { toast(friendly(e)); resync(); }
}
async function recordHistory(v) {
  if (!RV.user) return;
  S.me.history = [v.id, ...S.me.history.filter(x => x !== v.id)].slice(0, 100);
  try { await must(sb.from('watch_history').upsert({ user_id:RV.user.id, video_id:v.id, watched_at:new Date().toISOString() }, { onConflict:'user_id,video_id' })); } catch (e) {}
}
async function loadComments(v) {
  try {
    const rows = await must(sb.from('comments').select('id,user_id,body,created_at').eq('video_id', v.id).order('created_at', { ascending:false }).limit(100));
    const ids = [...new Set(rows.map(r => r.user_id))]; let ppl = [];
    if (ids.length) ppl = await must(sb.from('profiles').select('id,display_name,avatar_url').in('id', ids));
    S.comments[v.id] = rows.map(r => { const p = ppl.find(x => x.id === r.user_id) || {}; return { id:r.id, who:p.display_name || 'Pengguna', avatar:safeUrl(p.avatar_url), text:r.body, t:Date.parse(r.created_at) }; });
  } catch (e) { S.comments[v.id] = S.comments[v.id] || []; }
  if (UI.current === v.id && UI.view === 'watch') refreshWatch();
}
async function addComment(v, text) {
  if (!RV.need('berkomen')) return false;
  try {
    const r = await must(sb.from('comments').insert({ video_id:v.id, user_id:RV.user.id, body:text }).select().single());
    (S.comments[v.id] = S.comments[v.id] || []).unshift({ id:r.id, who:RV.name, avatar:safeUrl(RV.profile && RV.profile.avatar_url), text, t:Date.parse(r.created_at) });
    toast('Komen dihantar'); return true;
  } catch (e) { toast(friendly(e)); return false; }
}

/* ================= Penghala ================= */
function nav(h) {
  try { if (location.hash !== h) history.pushState(null, '', h); } catch (e) {}
  route(h); window.scrollTo(0, 0);
}
async function route(h) {
  const [a, b] = (h || '').replace(/^#\/?/, '').split('/');
  if (a === 'watch' && b) {
    const v = await ensureVideo(b);
    if (v) { UI.view = 'watch'; UI.current = b; recordHistory(v); loadComments(v); } else { toast('Video tidak ditemui'); UI.view = 'home'; }
  } else if (a === 'channel' && b) {
    const c = await ensureChannel(b);
    if (c) { UI.view = 'channel'; UI.chHandle = b; } else { toast('Saluran tidak ditemui'); UI.view = 'home'; }
  } else if (a === 'new-channel') { UI.view = 'home'; render(); openChannelDlg(); return; }
  else UI.view = VIEWS.includes(a) ? a : 'home';
  UI.cd = false; render();
}
function openVideo(id) {
  const v = byId(id); if (!v) return;
  v.views++; sb.rpc('increment_view', { p_video:id }).then(() => {}, () => {});
  nav('#/watch/' + id);
}
window.addEventListener('popstate', () => route(location.hash));

function render() {
  if (destroyPlayer) { destroyPlayer(); destroyPlayer = null; }
  clearInterval(heroTimer); stopPv();
  renderRail();
  ({ watch:renderWatch, channel:renderChannel, music:renderMusic }[UI.view] || renderList)();
  if (UI.view === 'home') startHero();
}
function renderRail() {
  $('#rail').innerHTML = NAV.map(([id, label, icon, cls]) =>
    `<a href="#/${id}" class="${cls || ''}" ${UI.view === id ? 'aria-current="page"' : ''}>${ic(icon)}<span>${label}</span></a>`).join('') +
    `<hr><a class="studio desk" href="${esc(CFG.studioUrl)}">${ic('disc')}<span>Music Studio</span></a>`;
}
function menuExtra() {
  let h = '';
  if (S.myCh.length) h += '<small>Saluran saya</small>' + S.myCh.map(id => { const c = S.channels[id]; return `<a href="#/channel/${esc(c.handle)}">${ic('film')}<span>${esc(c.name)}</span>${c.badge ? BADGE : ''}</a>`; }).join('');
  h += `<button data-newch>${ic('plus')}<span>Cipta saluran</span></button><a href="${esc(CFG.studioUrl)}">${ic('disc')}<span>Music Studio</span></a>`;
  return h;
}

/* ================= Komponen ================= */
function thumbInner(v) {
  const media = v.thumb ? `<img src="${esc(v.thumb)}" alt="">`
    : `<video src="${esc(v.src)}#t=0.6" preload="metadata" muted playsinline onerror="this.remove()" onloadedmetadata="setDur(this,'${v.id}')"></video>`;
  const b = v.privacy !== 'public' ? PRIV[v.privacy] : '';
  return `${media}<span class="pl">${ic('play')}</span><span class="dur" data-dur="${v.id}">${v.dur ? fmt(v.dur) : ''}</span>${b ? `<span class="badge">${b}</span>` : ''}`;
}
function setDur(el, id) {
  const v = byId(id);
  if (v && !v.dur && isFinite(el.duration)) { v.dur = el.duration; document.querySelectorAll(`[data-dur="${id}"]`).forEach(n => { n.textContent = fmt(v.dur); }); }
}
const avatar = (ch, cls = '') => `<a class="av ${cls}" href="#/channel/${esc(ch.handle)}" style="--g:${grad(ch.id)}" aria-label="Saluran ${esc(ch.name)}">${ch.avatar ? `<img src="${esc(ch.avatar)}" alt="">` : esc((ch.name[0] || '?').toUpperCase())}</a>`;
const chLink = ch => `<a class="chl" href="#/channel/${esc(ch.handle)}">${esc(ch.name)}</a>${ch.badge ? BADGE : ''}`;

const card = (v, i = 0) => { const ch = chOf(v); return `<article class="card rise" style="--i:${Math.min(i, 12)}" tabindex="0" role="link" data-open="${v.id}" aria-label="${esc(v.title)}">
  <div class="thumb" style="--g:${grad(v.id)}">${thumbInner(v)}</div>
  <div class="meta">${avatar(ch)}<div><h3>${esc(v.title)}</h3><p class="ch">${chLink(ch)}</p>

/* Pemain video Rocvid: kawalan sendiri, pintasan papan kekunci, pratonton bar carian */
function mountPlayer(v, ctx) {
  const root = $('#rp'), m = root.querySelector('.rp-media'), pv = root.querySelector('.rp-pv'), q = s => root.querySelector(s);
  const bar = q('.rp-bar'), played = q('.rp-played'), buf = q('.rp-buf'), knob = q('.rp-knob'), tip = q('.rp-tip'), tipT = tip.querySelector('span');
  const timeEl = q('.rp-time'), vol = q('.rp-vol input'), menu = q('.rp-menu'), big = q('.rp-big'), flashEl = q('.rp-flash'), P = PREFS;
  const speeds = [.5, .75, 1, 1.25, 1.5, 2];
  let idleT, raf, scrub = false, wasPlaying = false, clickT, lastPv = 0;
  m.src = v.src; if (pv) pv.src = v.src;
  m.volume = P.vol; m.muted = P.muted; m.playbackRate = P.rate; vol.value = P.muted ? 0 : P.vol;

  const flash = html => { flashEl.innerHTML = html; flashEl.classList.remove('go'); void flashEl.offsetWidth; flashEl.classList.add('go'); };
  const ripple = (side, text) => { const el = q('.rp-ripple.' + side); el.textContent = text; el.classList.remove('go'); void el.offsetWidth; el.classList.add('go'); };
  const state = s => {
    root.dataset.state = s;
    q('[data-p="play"]').innerHTML = ic(s === 'playing' ? 'pause' : s === 'ended' ? 'replay' : 'play');
    big.innerHTML = ic(s === 'ended' ? 'replay' : 'play');
  };
  const draw = () => {
    const d = m.duration || 0, t = m.currentTime, pct = d ? Math.min(100, t / d * 100) : 0;
    played.style.width = pct + '%'; knob.style.left = pct + '%';
    timeEl.textContent = `${fmt(t)} / ${fmt(d)}`;
    bar.setAttribute('aria-valuenow', Math.round(pct)); bar.setAttribute('aria-valuetext', `${fmt(t)} daripada ${fmt(d)}`);
  };
  const drawBuf = () => { if (m.duration && m.buffered.length) buf.style.width = Math.min(100, m.buffered.end(m.buffered.length - 1) / m.duration * 100) + '%'; };
  const loop = () => { cancelAnimationFrame(raf); const step = () => { draw(); if (!m.paused && !m.ended) raf = requestAnimationFrame(step); }; step(); };
  const wake = () => {
    root.classList.remove('idle'); clearTimeout(idleT);
    if (!m.paused && !scrub && !root.classList.contains('menu')) idleT = setTimeout(() => root.classList.add('idle'), 2600);
  };
  const toggle = () => { if (m.paused || m.ended) { if (m.ended) m.currentTime = 0; m.play().catch(() => {}); flash(ic('play')); } else { m.pause(); flash(ic('pause')); } };
  const seek = dt => {
    m.currentTime = Math.max(0, Math.min(m.duration || 0, m.currentTime + dt)); draw();
    if (Math.abs(dt) >= 10) ripple(dt < 0 ? 'l' : 'r', `${dt < 0 ? '-' : '+'}${Math.abs(dt)} saat`);
  };
  const updVol = () => { q('[data-p="mute"]').innerHTML = ic(m.muted || m.volume === 0 ? 'mute' : m.volume < .5 ? 'vollow' : 'vol'); vol.value = m.muted ? 0 : m.volume; };
  const setVol = x => { x = Math.max(0, Math.min(1, x)); m.volume = x; m.muted = x === 0; flash(Math.round(x * 100) + '%'); };
  const mute = () => { m.muted = !m.muted; if (!m.muted && m.volume === 0) m.volume = .5; flash(ic(m.muted ? 'mute' : 'vol')); };
  const setRate = r => {
    m.playbackRate = r; P.rate = r; savePrefs(); flash(r + 'x');
    menu.querySelectorAll('[data-rate]').forEach(b => b.setAttribute('aria-pressed', +b.dataset.rate === r));
  };
  const stepRate = d => { const i = speeds.findIndex(x => x >= m.playbackRate - .001); setRate(speeds[Math.max(0, Math.min(speeds.length - 1, (i < 0 ? 2 : i) + d))]); };
  const menuOpen = o => { menu.hidden = !o; root.classList.toggle('menu', o); q('[data-p="menu"]').setAttribute('aria-expanded', o); wake(); };
  const theater = () => {
    const w = $('.watch'); if (!w) return;
    UI.theater = w.classList.toggle('theater'); q('[data-p="theater"]').setAttribute('aria-pressed', UI.theater);
  };
  const isFs = () => document.fullscreenElement === root || root.classList.contains('pfs');
  const updFs = () => { q('[data-p="fs"]').innerHTML = ic(isFs() ? 'fsx' : 'fs'); };
  const fs = () => {
    if (isFs()) { if (document.fullscreenElement) document.exitFullscreen(); root.classList.remove('pfs'); document.body.style.overflow = ''; updFs(); return; }
    const p = root.requestFullscreen ? root.requestFullscreen() : Promise.reject();
    Promise.resolve(p).catch(() => { root.classList.add('pfs'); document.body.style.overflow = 'hidden'; updFs(); });
  };
  const pip = () => {
    if (!pv || !document.pictureInPictureEnabled) return;
    document.pictureInPictureElement === m ? document.exitPictureInPicture() : m.requestPictureInPicture().catch(() => {});
  };

  m.addEventListener('play', () => { state('playing'); loop(); wake(); });
  m.addEventListener('pause', () => { if (!m.ended) state('paused'); wake(); });
  m.addEventListener('ended', () => {
    state('ended'); root.classList.remove('idle');
    if (P.autonext && ctx.next && !m.loop) setTimeout(() => { if (root.isConnected && m.ended) { toast('Memainkan video seterusnya'); ctx.next(); } }, 900);
  });
  m.addEventListener('waiting', () => root.classList.add('buf'));
  ['playing', 'canplay', 'seeked'].forEach(e => m.addEventListener(e, () => root.classList.remove('buf')));
  ['loadedmetadata', 'durationchange', 'timeupdate'].forEach(e => m.addEventListener(e, draw));
  m.addEventListener('progress', drawBuf); m.addEventListener('loadedmetadata', drawBuf);
  m.addEventListener('volumechange', () => { P.vol = m.volume; P.muted = m.muted; savePrefs(); updVol(); });
  m.addEventListener('error', () => { root.classList.add('err'); root.classList.remove('buf'); q('.rp-err').hidden = false; });

  q('.rp-hit').addEventListener('click', e => {
    if (root.classList.contains('menu')) { menuOpen(false); return; }
    if (e.detail >= 2) return;
    clearTimeout(clickT);
    clickT = setTimeout(() => { if (e.pointerType === 'touch' && root.classList.contains('idle')) wake(); else toggle(); }, 220);
  });
  q('.rp-hit').addEventListener('dblclick', e => {
    clearTimeout(clickT);
    const r = e.currentTarget.getBoundingClientRect(), x = (e.clientX - r.left) / r.width;
    x < .33 ? seek(-10) : x > .67 ? seek(10) : fs();
  });
  root.addEventListener('click', e => {
    const b = e.target.closest('[data-p],[data-rate],[data-retry]'); if (!b) return;
    if (b.dataset.retry !== undefined) { root.classList.remove('err'); q('.rp-err').hidden = true; m.load(); m.play().catch(() => {}); return; }
    if (b.dataset.rate) return setRate(+b.dataset.rate);
    ({ play:toggle, next:() => ctx.next && ctx.next(), mute, menu:() => menuOpen(menu.hidden), theater, pip, fs }[b.dataset.p] || (() => {}))();
  });
  root.addEventListener('change', e => { if (e.target.matches('[data-loop]')) m.loop = e.target.checked; });
  vol.addEventListener('input', () => { m.muted = false; m.volume = +vol.value; if (m.volume === 0) m.muted = true; });

  const pos = e => { const r = bar.getBoundingClientRect(); return Math.max(0, Math.min(1, (e.clientX - r.left) / r.width)); };
  const showTip = p => {
    const d = m.duration || 0; tipT.textContent = fmt(p * d);
    const w = tip.offsetWidth, bw = bar.clientWidth; tip.style.left = Math.max(w / 2, Math.min(bw - w / 2, p * bw)) + 'px';
    if (pv && d && Date.now() - lastPv > 90) { lastPv = Date.now(); try { pv.currentTime = p * d; } catch (e) {} }
  };
  bar.addEventListener('pointerenter', () => { tip.style.opacity = 1; });
  bar.addEventListener('pointerleave', () => { if (!scrub) tip.style.opacity = 0; });
  bar.addEventListener('pointerdown', e => {
    if (!m.duration) return;
    bar.setPointerCapture(e.pointerId); scrub = true; root.classList.add('scrub'); wasPlaying = !m.paused; m.pause();
    m.currentTime = pos(e) * m.duration; draw(); showTip(pos(e));
  });
  bar.addEventListener('pointermove', e => { const p = pos(e); showTip(p); if (scrub) { m.currentTime = p * m.duration; draw(); } });
  const endScrub = () => { if (!scrub) return; scrub = false; root.classList.remove('scrub'); tip.style.opacity = 0; if (wasPlaying) m.play().catch(() => {}); };
  bar.addEventListener('pointerup', endScrub); bar.addEventListener('pointercancel', endScrub);
  bar.addEventListener('keydown', e => {
    const k = { ArrowLeft:-5, ArrowRight:5 }[e.key];
    if (k) { seek(k); e.preventDefault(); } else if (e.key === 'Home') { m.currentTime = 0; e.preventDefault(); } else if (e.key === 'End') { m.currentTime = m.duration; e.preventDefault(); }
  });

  ['pointermove', 'pointerdown', 'focusin', 'keydown'].forEach(e => root.addEventListener(e, wake));
  root.addEventListener('pointerleave', () => { if (!m.paused && !root.classList.contains('menu')) root.classList.add('idle'); });

  const onKey = e => {
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    const tg = e.target;
    if (/^(INPUT|TEXTAREA|SELECT)$/.test(tg.tagName) || tg.isContentEditable || tg.closest('.rp-bar')) return;
    if ((e.key === ' ' || e.key === 'Enter') && tg.closest('button,a,[role="link"]')) return;
    if (document.querySelector('dialog[open]')) return;
    const k = e.key.length === 1 ? e.key.toLowerCase() : e.key;
    const frame = d => { m.pause(); m.currentTime = Math.max(0, m.currentTime + d / 30); };
    const map = { ' ':toggle, k:toggle, j:() => seek(-10), l:() => seek(10), ArrowLeft:() => seek(-5), ArrowRight:() => seek(5),
      ArrowUp:() => setVol(m.volume + .05), ArrowDown:() => setVol(m.volume - .05), m:mute, f:fs, t:theater, i:pip,
      Home:() => { m.currentTime = 0; }, End:() => { m.currentTime = m.duration || 0; }, ',':() => frame(-1), '.':() => frame(1),
      '<':() => stepRate(-1), '>':() => stepRate(1), Escape:() => menuOpen(false) };
    if (/^[0-9]$/.test(k) && m.duration) { m.currentTime = m.duration * (+k / 10); e.preventDefault(); return; }
    if (map[k]) { map[k](); e.preventDefault(); }
  };
  document.addEventListener('keydown', onKey);
  const onFs = () => { if (!document.fullscreenElement) root.classList.remove('pfs'); updFs(); };
  document.addEventListener('fullscreenchange', onFs);

  if (v.type === 'audio_track' && 'mediaSession' in navigator) {
    try {
      navigator.mediaSession.metadata = new MediaMetadata({ title:v.title, artist:chOf(v).name, artwork:v.thumb ? [{ src:v.thumb, sizes:'600x600' }] : [] });
      navigator.mediaSession.setActionHandler('play', () => m.play());
      navigator.mediaSession.setActionHandler('pause', () => m.pause());
      navigator.mediaSession.setActionHandler('seekto', d => { m.currentTime = d.seekTime; });
    } catch (e) {}
  }

  state('paused'); updVol(); draw();
  m.play().catch(() => {});
  return () => {
    cancelAnimationFrame(raf); clearTimeout(idleT); clearTimeout(clickT);
    document.removeEventListener('keydown', onKey); document.removeEventListener('fullscreenchange', onFs);
    if (document.fullscreenElement) document.exitFullscreen().catch(() => {});
    document.body.style.overflow = '';
    [m, pv].forEach(el => { if (el) { el.pause(); el.removeAttribute('src'); el.load(); } });
  };
}

function renderWatch() {
  const v = byId(UI.current), ch = chOf(v);
  const rel = S.videos.filter(x => x.id !== v.id && vis(x))
    .sort((a, b) => (b.chId === v.chId) - (a.chId === v.chId) || (b.cat === v.cat) - (a.cat === v.cat) || b.views - a.views).slice(0, 10);
  $('#main').innerHTML = `<div class="watch ${UI.theater ? 'theater' : ''}"><div>
    ${mediaTabs(v)}${playerHTML(v, !!rel[0])}
    <h1>${esc(v.title)}</h1>
    <div class="wrow">
      <div class="chan">${avatar(ch)}<div><strong>${chLink(ch)}</strong><small id="subCount"></small></div><button class="btn" id="subBtn" data-act="sub"></button></div>
      <div class="acts" id="acts"></div>
    </div>
    <div class="desc"><div class="st"><span>${num(v.views)} tontonan</span><span>${ago(v.t)}</span>${v.cat ? `<span>${esc(v.cat)}</span>` : ''}</div>
      <p>${esc(v.desc || 'Tiada penerangan.').replace(/\n/g, '<br>')}</p>${musicInfo(v)}</div>
    <section class="cm"><h2 id="cmHead"></h2>
      <form class="cform" id="cmForm"><textarea id="cmText" rows="1" maxlength="500" placeholder="${RV.user ? 'Tulis komen' : 'Log masuk untuk berkomen'}" aria-label="Tulis komen"></textarea><button class="btn primary" type="submit">Hantar</button></form>
      <div id="cmList"></div></section>
  </div>
  <aside><div class="relh"><h2>Seterusnya</h2><label class="sw"><span>Automatik</span><input type="checkbox" data-pref="autonext" ${PREFS.autonext ? 'checked' : ''}></label></div>
    ${rel.map(relCard).join('') || '<p class="muted">Belum ada video lain.</p>'}</aside></div>`;
  destroyPlayer = mountPlayer(v, { next:() => rel[0] && openVideo(rel[0].id) });
  refreshWatch();
}

function refreshWatch() {
  const v = byId(UI.current); if (!v || UI.view !== 'watch') return;
  const ch = chOf(v), subbed = has('subs', v.chId), sb_ = $('#subBtn'), owner = isMine(v);
  if (myChannel(ch)) { sb_.style.display = 'none'; $('#subCount').textContent = 'Saluran anda'; }
  else {
    sb_.style.display = ''; sb_.textContent = subbed ? 'Dilanggan' : 'Langgan';
    sb_.setAttribute('aria-pressed', subbed); sb_.classList.toggle('primary', !subbed);
    $('#subCount').textContent = num(ch.subs) + ' pelanggan';
  }
  $('#acts').innerHTML = `
    <div class="seg">
      <button class="btn" data-act="like" aria-pressed="${has('liked', v.id)}" aria-label="Suka">${ic('thumb')}<span>${num(v.likes)}</span></button>
      <button class="btn" data-act="dislike" aria-pressed="${has('disliked', v.id)}" aria-label="Tidak suka">${ic('thumb', 'flip')}</button>
    </div>
    <button class="btn" data-act="later" aria-pressed="${has('later', v.id)}">${ic('bookmark')}<span>Simpan</span></button>
    <button class="btn" data-act="share">${ic('share')}<span>Kongsi</span></button>
    <button class="btn ghost" data-act="report">${ic('flag')}<span>Lapor</span></button>
    ${owner && v.type === 'standard' ? `<button class="btn danger" data-act="delete">${UI.cd ? 'Sahkan padam' : 'Padam'}</button>` : ''}`;
  const cs = S.comments[v.id] || [];
  $('#cmHead').textContent = (cs.length || v.comments || 0) + ' komen';
  $('#cmHead').textContent = cs.length + ' komen';
  $('#cmList').innerHTML = cs.map(c => `<div class="c"><div class="av" style="--g:${grad(c.who)}">${c.avatar ? `<img src="${esc(c.avatar)}" alt="" referrerpolicy="no-referrer">` : esc(c.who[0].toUpperCase())}</div>
    <div><div><b>${esc(c.who)}</b><span class="when">${ago(c.t)}</span></div><p>${esc(c.text)}</p></div></div>`).join('') || '<p class="muted">Belum ada komen. Jadi yang pertama.</p>';
}

async function doAct(a) {
  const v = byId(UI.current); if (!v) return;
  if (a === 'like') return setVote(v, 1);
  if (a === 'dislike') return setVote(v, -1);
  if (a === 'later') return toggleSaved(v);
  if (a === 'sub') return toggleSub(v.chId);
  if (a === 'share') {
    const link = location.href.split('#')[0] + '#/watch/' + v.id;
    return (navigator.clipboard ? navigator.clipboard.writeText(link) : Promise.reject()).then(() => toast('Pautan disalin'), () => toast('Tidak dapat menyalin pautan'));
  }
  if (a === 'report') { if (RV.need('melaporkan kandungan')) $('#rpDlg').showModal(); return; }
  if (a === 'delete') {
    if (!UI.cd) { UI.cd = true; toast('Tekan sekali lagi untuk memadam'); refreshWatch(); return; }
    try {
      await must(sb.from('videos').delete().eq('id', v.id));
      sb.storage.from('media').remove([v.srcPath, v.thumbPath].filter(Boolean)).then(() => {}, () => {});
      S.videos = S.videos.filter(x => x.id !== v.id); toast('Video dipadam'); nav('#/mine');
    } catch (e) { toast(friendly(e)); }
  }
}

/* ================= Pratonton semasa hover ================= */
function stopPv() { if (pvEl) { pvEl.pause(); pvEl.removeAttribute('src'); pvEl.load(); pvEl.remove(); pvEl = null; } }
document.addEventListener('mouseover', e => {
  if (!matchMedia('(hover:hover)').matches) return;
  const th = e.target.closest('.card .thumb'); if (!th || th.querySelector('.pv')) return;
  stopPv();
  const v = byId(th.closest('.card').dataset.open); if (!v || v.type === 'audio_track' || !v.src) return;
  const el = document.createElement('video'); el.className = 'pv'; el.muted = true; el.loop = true; el.playsInline = true; el.src = v.src;
  th.appendChild(el); pvEl = el; el.play().then(() => el.classList.add('on')).catch(() => { el.remove(); if (pvEl === el) pvEl = null; });
});
document.addEventListener('mouseout', e => {
  const th = e.target.closest && e.target.closest('.card .thumb');
  if (th && !th.contains(e.relatedTarget)) stopPv();
});

/* ================= Dialog saluran ================= */
function openChannelDlg(chId) {
  if (!RV.need(chId ? 'mengurus saluran' : 'mencipta saluran')) return;
  UI.chEdit = chId || null;
  const ch = chId && S.channels[chId];
  $('#chT').textContent = ch ? 'Edit saluran' : 'Cipta saluran';
  $('#cEmail').textContent = RV.user.email || '';
  $('#cName').value = ch ? ch.name : ''; $('#cBio').value = ch ? ch.bio : '';
  const h = $('#cHandle'); h.value = ch ? ch.handle : ''; h.disabled = !!ch; h.dataset.touched = ch ? '1' : '';
  $('#cAvatar').value = ''; $('#cBanner').value = ''; $('#cErr').textContent = '';
  $('#cHint').style.display = ch ? 'none' : '';
  $('#chDlg').showModal();
}
$('#cName').addEventListener('input', e => { const h = $('#cHandle'); if (!h.dataset.touched) h.value = slugify(e.target.value).slice(0, 40); });
$('#cHandle').addEventListener('input', e => { e.target.dataset.touched = '1'; e.target.value = e.target.value.toLowerCase().replace(/[^a-z0-9_-]/g, ''); });
$('#chForm').addEventListener('submit', async e => {
  e.preventDefault();
  const err = m => { $('#cErr').textContent = m; }, btn = $('#cGo');
  const name = $('#cName').value.trim(), handle = $('#cHandle').value.trim(), bio = $('#cBio').value.trim();
  const av = $('#cAvatar').files[0], bn = $('#cBanner').files[0];
  if (!name) return err('Masukkan nama saluran.');
  if (!UI.chEdit && !/^[a-z0-9][a-z0-9_-]{1,39}$/.test(handle)) return err('Nama pengguna: 2-40 aksara, huruf kecil, nombor, - atau _.');
  if (S.artists.some(a => a.name.toLowerCase() === name.toLowerCase()) && !(UI.chEdit && S.channels[UI.chEdit].badge)) return err('Nama ini digunakan oleh artis berdaftar. Pilih nama lain.');
  if ((av && !av.type.startsWith('image/')) || (bn && !bn.type.startsWith('image/'))) return err('Gambar mesti fail imej.');
  btn.disabled = true; btn.textContent = 'Menyimpan…';
  try {
    const avatar_path = av ? await uploadFile(av, 'avatars') : undefined, banner_path = bn ? await uploadFile(bn, 'banners') : undefined;
    let row;
    if (UI.chEdit) {
      const patch = { name, bio }; if (avatar_path) patch.avatar_path = avatar_path; if (banner_path) patch.banner_path = banner_path;
      row = await must(sb.from('channels').update(patch).eq('id', UI.chEdit).select().single());
    } else {
      row = await must(sb.from('channels').insert({ owner_id:RV.user.id, kind:'personal', handle, name, bio, avatar_path:avatar_path || null, banner_path:banner_path || null }).select().single());
    }
    const c = mapChannel(row); S.channels[c.id] = c;
    if (!S.myCh.includes(c.id) && c.kind === 'personal') S.myCh.push(c.id);
    RV.mountAuth(menuExtra()); $('#chDlg').close(); toast(UI.chEdit ? 'Saluran dikemas kini' : 'Saluran dicipta');
    nav('#/channel/' + c.handle);
  } catch (ex) { err(friendly(ex)); }
  btn.disabled = false; btn.textContent = 'Simpan';
});

/* ================= Muat naik video ================= */
$('#fCat').innerHTML = CATS.slice(1).map(c => `<option>${c}</option>`).join('');
function openUpload(preferCh) {
  if (!RV.need('memuat naik video')) return;
  if (!S.myCh.length) { toast('Cipta saluran dahulu untuk memuat naik video'); openChannelDlg(); return; }
  $('#fCh').innerHTML = S.myCh.map(id => `<option value="${id}">${esc(S.channels[id].name)}</option>`).join('');
  if (preferCh && S.myCh.includes(preferCh)) $('#fCh').value = preferCh;
  $('#fErr').textContent = ''; $('#fLimit').textContent = `MP4, WebM atau MOV. Maksimum ${CFG.maxUploadMB} MB.`;
  $('#upDlg').showModal();
}
$('#fVid').addEventListener('change', e => {
  const f = e.target.files[0];
  $('#fName').textContent = f ? `${f.name} (${(f.size / 1048576).toFixed(1)} MB)` : 'Pilih fail video';
  if (f && !$('#fTitle').value) $('#fTitle').value = f.name.replace(/\.[^.]+$/, '').slice(0, 100);
});
$('#upForm').addEventListener('submit', async e => {
  e.preventDefault();
  const f = $('#fVid').files[0], tf = $('#fThumb').files[0], title = $('#fTitle').value.trim(), btn = $('#fGo');
  const err = m => { $('#fErr').textContent = m; };
  if (!f) return err('Pilih fail video dahulu.');
  if (!f.type.startsWith('video/')) return err('Fail mesti dalam format video.');
  if (f.size > CFG.maxUploadMB * 1048576) return err(`Fail melebihi had ${CFG.maxUploadMB} MB.`);
  if (!title) return err('Masukkan tajuk video.');
  if (tf && !tf.type.startsWith('image/')) return err('Gambar kecil mesti fail imej.');
  if (!$('#fOwn').checked) return err('Sahkan bahawa anda berhak menggunakan video ini.');
  btn.disabled = true; btn.textContent = 'Memuat naik…'; err('');
  try {
    const [src, thumb, dur] = await Promise.all([uploadFile(f, 'videos'), tf ? uploadFile(tf, 'thumbs') : null, mediaDuration(f)]);
    const row = await must(sb.from('videos').insert({ channel_id:$('#fCh').value, uploader_id:RV.user.id, type:'standard', title, description:$('#fDesc').value.trim(),
      category:$('#fCat').value, privacy:$('#fPriv').value, status:'ready', src_path:src, thumb_path:thumb, duration_s:dur || null }).select().single());
    S.videos.unshift(mapVideo(row));
    $('#upForm').reset(); $('#fName').textContent = 'Pilih fail video'; $('#upDlg').close(); toast('Video diterbitkan'); nav('#/mine');
  } catch (ex) { err(friendly(ex)); }
  btn.disabled = false; btn.textContent = 'Terbitkan';
});

/* ================= Peristiwa ================= */
document.addEventListener('click', e => {
  const t = e.target; let el;
  if (t.closest('.upop a, .upop button:not([data-auth])')) $$('.upop').forEach(p => { p.hidden = true; });
  if (t.closest('[data-newch]')) { openChannelDlg(); return; }
  if ((el = t.closest('a[href^="#/"]'))) { e.preventDefault(); if (el.classList.contains('logo')) { UI.q = ''; $('#q').value = ''; UI.cat = 'Semua'; } nav(el.getAttribute('href')); return; }
  if ((el = t.closest('[data-slide]'))) { clearInterval(heroTimer); setSlide(+el.dataset.slide); return; }
  if ((el = t.closest('[data-cat]'))) { UI.cat = el.dataset.cat; renderList(); return; }
  if ((el = t.closest('[data-sub]'))) { toggleSub(el.dataset.sub); return; }
  if ((el = t.closest('[data-editch]'))) { openChannelDlg(el.dataset.editch); return; }
  if ((el = t.closest('[data-act]'))) { doAct(el.dataset.act); return; }
  if ((el = t.closest('[data-open]'))) { openVideo(el.dataset.open); return; }
  if ((el = t.closest('[data-upload]'))) { openUpload(el.dataset.chid); return; }
  if (t.closest('#themeBtn')) { setTheme(document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark'); return; }
});
document.addEventListener('keydown', e => {
  if (e.key !== 'Enter') return;
  const o = e.target.closest && e.target.closest('[data-open]');
  if (o && e.target === o) openVideo(o.dataset.open);
});
document.addEventListener('change', e => {
  const el = e.target;
  if (el.dataset.pref) { PREFS[el.dataset.pref] = el.checked; savePrefs(); document.querySelectorAll(`[data-pref="${el.dataset.pref}"]`).forEach(x => { x.checked = el.checked; }); }
});
$('#sf').addEventListener('submit', e => e.preventDefault());
$('#q').addEventListener('input', e => {
  UI.q = e.target.value;
  if (!VIEWS.includes(UI.view) || UI.view === 'music') { UI.view = 'home'; try { history.pushState(null, '', '#/home'); } catch (x) {} render(); } else renderList();
  renderRail();
});
document.addEventListener('submit', async e => {
  if (e.target.id !== 'cmForm') return;
  e.preventDefault();
  const v = byId(UI.current), ta = $('#cmText'), text = ta.value.trim(); if (!text) return;
  if (await addComment(v, text)) { ta.value = ''; refreshWatch(); }
});
$('#rpForm').addEventListener('submit', async e => {
  e.preventDefault();
  try {
    await must(sb.from('reports').insert({ reporter_id:RV.user.id, video_id:UI.current, reason:(new FormData(e.target)).get('why') }));
    $('#rpDlg').close(); toast('Laporan dihantar. Terima kasih');
  } catch (ex) { toast(friendly(ex)); }
});
$('#themeBtn').addEventListener('click', () => {});

/* ================= Mula ================= */
async function onAuth() {
  try { await loadMine(); } catch (e) { toast(friendly(e)); }
  RV.mountAuth(menuExtra());
  if (RV.user && !S.myCh.length) toast('Selamat datang! Cipta saluran untuk mula memuat naik video.');
  const ld = $('#loginDlg'); if (ld && ld.open) ld.close();
  render();
}
(async () => {
  initTheme(); renderRail();
  if (!CONFIGURED || !sb) { $('#main').innerHTML = RV.setupHTML(); return; }
  await RV.initAuth(onAuth);
  RV.mountAuth(menuExtra());
  try { await loadPublic(); await loadMine(); }
  catch (e) {
    $('#main').innerHTML = `<div class="setup"><h1>Pangkalan data belum sedia</h1><p class="muted">${esc(friendly(e))}</p>
      <p class="muted" style="margin-top:10px">${/relation|schema|PGRST20|42P01/i.test(e.message || '') ? 'Jalankan <b>rocvid_schema.sql</b> dalam Supabase SQL Editor, kemudian muat semula.' : 'Semak URL dan kunci anon dalam config.js.'}</p></div>`;
    return;
  }
  RV.mountAuth(menuExtra());
  route(location.hash);
})();
